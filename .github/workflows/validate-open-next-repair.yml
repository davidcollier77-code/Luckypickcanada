name: Validate OpenNext Repair

on:
  workflow_dispatch: {}
  pull_request:
  merge_group:

jobs:
  validate:
    name: Validate OpenNext build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.3

      - name: Install dependencies (pnpm install)
        run: pnpm install --frozen-lockfile

      - name: Clear cache directories
        run: rm -rf .next/cache .open-next

      - name: Build Next.js app
        run: pnpm run build

      - name: Build OpenNext for Cloudflare
        run: pnpm exec opennextjs-cloudflare build

      - name: Verify .open-next/worker.js exists
        run: |
          if [ -f .open-next/worker.js ]; then
            echo "WORKER EXISTS";
          else
            echo "WORKER MISSING";
            ls -la .open-next || true;
            exit 1;
          fi

      - name: Verify .open-next/assets directory exists
        run: |
          if [ -d .open-next/assets ]; then
            echo "ASSETS DIR EXISTS";
          else
            echo "ASSETS DIR MISSING";
            ls -la .open-next || true;
            exit 1;
          fi

      - name: Wrangler build validation (no deploy)
        run: pnpm exec wrangler build --config ./wrangler.jsonc

      - name: Git status
        run: git status --porcelain=2 --branch
