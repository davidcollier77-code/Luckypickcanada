name: Validate OpenNext Repair

on:
  workflow_dispatch: {}
  pull_request:
  merge_group:

jobs:
  validate:
    name: Validate OpenNext build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (pnpm install)
        run: pnpm install

      - name: Build (pnpm run build)
        run: pnpm run build

      - name: Verify .open-next/worker.js exists
        run: |
          if [ -f .open-next/worker.js ]; then
            echo "WORKER EXISTS";
          else
            echo "WORKER MISSING";
            ls -la .open-next || true;
            exit 1;
          fi

      - name: Verify .open-next/assets directory exists
        run: |
          if [ -d .open-next/assets ]; then
            echo "ASSETS DIR EXISTS";
          else
            echo "ASSETS DIR MISSING";
            ls -la .open-next || true;
            exit 1;
          fi

      - name: Wrangler build validation (no deploy)
        run: pnpm dlx wrangler build --config ./wrangler.jsonc

      - name: Git status
        run: git status --porcelain=2 --branch
