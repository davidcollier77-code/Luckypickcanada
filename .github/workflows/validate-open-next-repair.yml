name: Validate OpenNext Repair

on:
  workflow_dispatch: {}
  pull_request:
  merge_group:

permissions:
  contents: read

# A newer commit supersedes an in-flight build validation for the same pull
# request. The newest commit is the one that must be validated, and cancelling
# the superseded run frees the runner for it. The validation steps themselves
# are unchanged.
concurrency:
  group: validate-open-next-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OpenNext build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # setup-node resolves `pnpm` for its cache before this step would have run the
      # other way round, so pnpm is installed first. Otherwise the job fails with
      # "Unable to locate executable file: pnpm" and no validation step ever runs.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3

      - name: Use Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
          # Reuse the pnpm content-addressed store between runs. The frozen
          # lockfile still decides exactly which packages are linked.
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (pnpm install)
        run: pnpm install --frozen-lockfile

      - name: Clear cache directories
        run: rm -rf .next/cache .open-next

      - name: Build Next.js app
        run: pnpm run build

      - name: Measure and enforce .next + public size (495 MiB hard cap)
        shell: bash
        run: |
          set -euo pipefail
          size_bytes="$(du -sb .next public | awk '{total += $1} END {printf "%.0f", total}')"
          max_bytes="$((495 * 1024 * 1024))"
          size_mib="$(awk -v bytes="$size_bytes" 'BEGIN {printf "%.2f", bytes / 1024 / 1024}')"
          printf 'Combined .next + public: %s bytes (%s MiB)\n' "$size_bytes" "$size_mib"
          printf 'Hard maximum: %s bytes (495 MiB)\n' "$max_bytes"
          if (( size_bytes >= max_bytes )); then
            echo "::error::Combined .next + public build size reached or exceeded 495 MiB; stopping before OpenNext build."
            exit 1
          fi

      - name: Build OpenNext for Cloudflare
        run: pnpm exec opennextjs-cloudflare build

      - name: Verify compiled Tailwind CSS
        run: |
          css_dir=".open-next/assets/_next/static/css"
          if [ ! -d "$css_dir" ]; then
            echo "COMPILED CSS DIR MISSING";
            find .open-next/assets -maxdepth 4 -type d | sort | head -100 || true;
            exit 1
          fi

          css_file="$(find "$css_dir" -type f -name '*.css' -print -quit)"
          if [ -z "$css_file" ]; then
            echo "NO GENERATED CSS FILE FOUND";
            find "$css_dir" -maxdepth 2 -type f -print | sort | head -100 || true;
            exit 1
          fi

          if grep -R -n -F '@tailwind base;' "$css_dir"; then
            echo "UNPROCESSED TAILWIND DIRECTIVE DETECTED";
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -gt 1 ]; then
              echo "TAILWIND CSS SCAN FAILED (grep exit $grep_status)";
              exit "$grep_status"
            fi
          fi

          echo "TAILWIND CSS COMPILED"

      - name: Verify .open-next/worker.js exists
        run: |
          if [ -f .open-next/worker.js ]; then
            echo "WORKER EXISTS";
          else
            echo "WORKER MISSING";
            ls -la .open-next || true;
            exit 1
          fi

      - name: Verify .open-next/assets directory exists
        run: |
          if [ -d .open-next/assets ]; then
            echo "ASSETS DIR EXISTS";
          else
            echo "ASSETS DIR MISSING";
            ls -la .open-next || true;
            exit 1
          fi

      - name: Wrangler build validation (no deploy)
        run: pnpm exec wrangler build --config ./wrangler.jsonc

      - name: Git status
        run: git status --porcelain=2 --branch
