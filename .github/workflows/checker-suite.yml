name: Checker Suite

# Independent changed-code checks, one job and one sticky comment each:
#   * Test quality  - weak tests in changed test files.
#   * Performance   - resource work started without a teardown.
#   * Security      - open code-scanning alerts, as text on the pull request.
#
# Every job is advisory and never replaces a required check. The pull request's
# code is never checked out or executed: only the trusted base branch is.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  security-events: read

concurrency:
  group: checker-suite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REPOSITORY: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  test-quality:
    name: Test quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted checker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Fetch changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > "$RUNNER_TEMP/files.json"

      - name: Review test quality
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 .github/scripts/checker_suite.py \
            test-quality --files "$RUNNER_TEMP/files.json" \
            --comment "$RUNNER_TEMP/comment.md"

      # A comment failure never changes the gate, and the comment is updated in
      # place so a re-run does not add another one.
      - name: Publish test-quality comment
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/upsert_pr_comment.sh '<!-- qa-test-quality -->' \
            "$RUNNER_TEMP/comment.md"

  performance:
    name: Performance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted checker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Fetch changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > "$RUNNER_TEMP/files.json"

      - name: Review resource work
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 .github/scripts/checker_suite.py \
            performance --files "$RUNNER_TEMP/files.json" \
            --comment "$RUNNER_TEMP/comment.md"

      - name: Publish performance comment
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/upsert_pr_comment.sh '<!-- qa-performance -->' \
            "$RUNNER_TEMP/comment.md"

  security-summary:
    name: Security alerts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted checker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      # Read-only: the alerts DevSkim and CodeQL already produced. If the API is
      # unavailable the comment says so and the job still succeeds.
      - name: Fetch open code-scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! gh api "repos/${REPOSITORY}/code-scanning/alerts?pr=${PR_NUMBER}&state=open&per_page=100" \
              > "$RUNNER_TEMP/alerts.json" 2> "$RUNNER_TEMP/alerts.err"; then
            printf '{"message": "the code-scanning alerts could not be read"}\n' \
              > "$RUNNER_TEMP/alerts.json"
            cat "$RUNNER_TEMP/alerts.err" >&2 || true
          fi

      - name: Render security summary
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 .github/scripts/checker_suite.py \
            security-summary --alerts "$RUNNER_TEMP/alerts.json" \
            --comment "$RUNNER_TEMP/comment.md"

      - name: Publish security comment
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/upsert_pr_comment.sh '<!-- qa-security-summary -->' \
            "$RUNNER_TEMP/comment.md"
