name: Prepare newly sourced Crystal Ball audio

on:
  push:
    branches:
      - feat/crystal-ball-new-sourced-audio
    paths:
      - .github/workflows/prepare-crystal-ball-audio-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crystal-ball-audio-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg when needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          curl --version | head -n 1

      - name: Download new source audio with curl (no API key)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crystal-ball-source" public/sounds
          curl --location --fail --show-error --silent --retry 3 --retry-all-errors \
            -A "LuckyPickCanada licensed audio asset acquisition" \
            "https://cdn.pixabay.com/download/audio/2026/05/14/audio_618d222656.mp3?filename=coghezzi-holy-aura-resonance-magical-energy-loop-533856.mp3" \
            -o "$RUNNER_TEMP/crystal-ball-source/energy.mp3"
          curl --location --fail --show-error --silent --retry 3 --retry-all-errors \
            -A "LuckyPickCanada licensed audio asset acquisition" \
            "https://cdn.pixabay.com/download/audio/2024/07/30/audio_e8c15810bd.mp3?filename=rescopicsound-elemental-magic-spell-impact-outgoing-228342.mp3" \
            -o "$RUNNER_TEMP/crystal-ball-source/reveal.mp3"
          curl --location --fail --show-error --silent --retry 3 --retry-all-errors \
            -A "LuckyPickCanada licensed audio asset acquisition" \
            "https://cdn.pixabay.com/download/audio/2022/07/15/audio_89f13f8631.mp3?filename=shidenbeatsmusic-sound-effect-twinklesparkle-115095.mp3" \
            -o "$RUNNER_TEMP/crystal-ball-source/leaf.mp3"
          for asset in "$RUNNER_TEMP"/crystal-ball-source/*.mp3; do
            test "$(wc -c < "$asset")" -gt 2048
            printf '%s %s bytes\n' "$(basename "$asset")" "$(wc -c < "$asset")"
          done

      - name: Convert source downloads to same-origin WAV
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/crystal-ball-source"
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -i "$source_dir/energy.mp3" -vn -ac 1 -ar 22050 -c:a pcm_s16le \
            public/sounds/crystal-ball-energy.wav
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -i "$source_dir/reveal.mp3" -vn -ac 1 -ar 22050 -c:a pcm_s16le \
            public/sounds/crystal-ball-reveal.wav
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -i "$source_dir/leaf.mp3" -vn -ac 1 -ar 22050 -c:a pcm_s16le \
            public/sounds/crystal-ball-leaf.wav
          # Only WAV deliverables and the source manifest are committed; MP3s stay in RUNNER_TEMP.

      - name: Verify WAV format, duration, audio content, and size
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import array
          import math
          import os
          import wave

          expected = {
              "public/sounds/crystal-ball-energy.wav": (14.5, 17.5),
              "public/sounds/crystal-ball-reveal.wav": (2.5, 3.5),
              "public/sounds/crystal-ball-leaf.wav": (1.5, 2.5),
          }
          for path, (minimum, maximum) in expected.items():
              size = os.path.getsize(path)
              if size > 2 * 1024 * 1024:
                  raise SystemExit(f"{path}: size exceeds 2 MiB ({size} bytes)")
              with open(path, "rb") as f:
                  header = f.read(12)
              if header[:4] != b"RIFF" or header[8:12] != b"WAVE":
                  raise SystemExit(f"{path}: invalid RIFF/WAVE header")
              with wave.open(path, "rb") as wav:
                  if wav.getnchannels() != 1 or wav.getsampwidth() != 2 or wav.getframerate() != 22050:
                      raise SystemExit(f"{path}: unexpected PCM parameters")
                  frames = wav.getnframes()
                  duration = frames / wav.getframerate()
                  raw = wav.readframes(frames)
              if not minimum <= duration <= maximum:
                  raise SystemExit(f"{path}: duration {duration:.3f}s outside {minimum}-{maximum}s")
              samples = array.array("h")
              samples.frombytes(raw)
              if len(samples) == 0:
                  raise SystemExit(f"{path}: empty sample data")
              peak = max(abs(sample) for sample in samples)
              rms = math.sqrt(sum(sample * sample for sample in samples) / len(samples))
              if peak < 400 or rms < 20:
                  raise SystemExit(f"{path}: samples appear silent (peak={peak}, rms={rms:.1f})")
              if peak >= 32760:
                  raise SystemExit(f"{path}: possible full-scale clipping (peak={peak})")
              print(f"PASS {path}: {duration:.3f}s, {size} bytes, peak={peak}, rms={rms:.1f}")
          PY

      - name: Commit only generated WAV assets to the source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sounds/crystal-ball-energy.wav \
                  public/sounds/crystal-ball-reveal.wav \
                  public/sounds/crystal-ball-leaf.wav
          if git diff --cached --quiet; then
            echo "No audio asset changes to commit."
            exit 0
          fi
          git commit -m "feat(audio): add newly sourced Crystal Ball WAV cues"
          git push origin "HEAD:${GITHUB_REF_NAME}"
