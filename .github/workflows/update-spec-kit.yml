name: Update Spec Kit

on:
  schedule:
    - cron: '21 2 * * 2,5' # Scheduled periodically
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-spec-kit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js and pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Upgrade Spec Kit
        continue-on-error: false
        run: |
          # The official Spec Kit upgrade process for CLI, integrations, and extensions
          # We must NOT use --force.

          # Upgrading the CLI
          specify upgrade

          # Upgrading integrations
          specify integration upgrade

          # Upgrading extensions
          specify extension upgrade

      - name: Validate Integration Status
        continue-on-error: false
        run: specify integration status --json

      - name: Run Governance Validation
        continue-on-error: false
        run: |
          chmod +x ./jules-verify.sh
          ./jules-verify.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update GitHub Spec Kit"
          title: "chore: Update GitHub Spec Kit"
          body: |
            Automated update of GitHub Spec Kit CLI, integrations, and extensions.

            This PR was generated automatically by the Spec Kit update workflow.
            The `specify integration status --json` and `./jules-verify.sh` governance checks have run.
          branch: "update/spec-kit"
          base: "main"
          delete-branch: true
