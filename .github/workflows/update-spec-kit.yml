name: Update Spec Kit

run-name: Update Spec Kit — ${{ github.event.inputs.dispatch_source || github.event_name }}

on:
  schedule:
    - cron: '5 1 * * 2,5' # Primary scheduled update
      timezone: 'America/Halifax'
    - cron: '5 5 * * 2,5' # Single retry if no successful update PR was submitted
      timezone: 'America/Halifax'
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: "Trigger source: manual owner request or Cloudflare scheduler."
        type: choice
        required: true
        default: manual
        options:
          - manual
          - cloudflare
      scheduler_slot:
        description: "Cloudflare scheduler slot; blank for a manual run."
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-spec-kit
  cancel-in-progress: false

jobs:
  update-spec-kit:
    # Keep native schedules active while the Cloudflare cutover is not approved.
    if: github.event_name != 'schedule' || vars.UPDATER_SCHEDULER_ACTIVE != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Skip if a successful update PR was already submitted today
        id: daily_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_SOURCE: ${{ github.event.inputs.dispatch_source || 'manual' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_SOURCE" != "cloudflare" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Owner-requested manual dispatch bypasses the daily-success guard."
            exit 0
          fi

          CURRENT_DATE="$(TZ=America/Halifax date +%F)"

          # Find earlier runs of this workflow and check whether one actually
          # created or refreshed an update PR today. The named marker step below
          # is recorded in the run's job steps, so no extra PR comment or file
          # is needed to remember successful completion.
          if ! RUN_LIST="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/update-spec-kit.yml/runs?per_page=100" --jq '.workflow_runs[] | [.id, .created_at] | @tsv')"; then
            echo "::warning::Could not inspect earlier workflow runs; proceeding so a recovery attempt remains possible."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS=$'\t' read -r RUN_ID CREATED_AT; do
            [ -n "$RUN_ID" ] || continue
            [ "$RUN_ID" != "$GITHUB_RUN_ID" ] || continue

            RUN_DATE="$(TZ=America/Halifax date -d "$CREATED_AT" +%F)"
            [ "$RUN_DATE" = "$CURRENT_DATE" ] || continue

            if ! JOBS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"; then
              echo "::warning::Could not inspect workflow run ${RUN_ID}; leaving recovery available."
              continue
            fi

            if printf '%s\n' "$JOBS_JSON" | jq -e '
              any(.jobs[]?.steps[]?;
                .name == "Record successful update PR submission" and .conclusion == "success")
            ' >/dev/null; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Run ${RUN_ID} already submitted a successful Spec Kit update PR on ${CURRENT_DATE}; skipping this run."
              exit 0
            fi
          done <<< "$RUN_LIST"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.daily_guard.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js and pnpm
        if: steps.daily_guard.outputs.skip != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'

      - name: Install pnpm
        if: steps.daily_guard.outputs.skip != 'true'
        run: npm install -g pnpm@10.30.3

      - name: Install uv
        if: steps.daily_guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        if: steps.daily_guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Test Spec Kit customization rebase
        if: steps.daily_guard.outputs.skip != 'true'
        run: bash scripts/test-rebase-speckit-customizations.sh

      - name: Upgrade Spec Kit
        if: steps.daily_guard.outputs.skip != 'true'
        continue-on-error: false
        run: bash scripts/update-spec-kit-safely.sh

      - name: Validate Integration Status
        if: steps.daily_guard.outputs.skip != 'true'
        continue-on-error: false
        run: |
          set -euo pipefail
          TEMP_DIR="$(mktemp -d)"
          FILES=(speckit.implement.md speckit.plan.md)
          restore_commands() {
            status=$?
            trap - EXIT
            for file in "${FILES[@]}"; do
              cp "$TEMP_DIR/$file" ".freebuff/cmds/$file" || echo "WARNING: failed to restore $file" >&2
            done
            rm -rf "$TEMP_DIR"
            exit "$status"
          }
          trap restore_commands EXIT
          for file in "${FILES[@]}"; do
            cp ".freebuff/cmds/$file" "$TEMP_DIR/$file"
            if ! cmp -s ".freebuff/cmds/$file" ".github/spec-kit/customizations/overlay/$file"; then
              echo "::error::$file does not match the recorded Freebuff customization overlay."
              exit 1
            fi
            cp ".github/spec-kit/customizations/base/$file" ".freebuff/cmds/$file"
          done
          # Validate the upstream-managed files against the upstream hashes in the manifest.
          # The EXIT trap always restores the Freebuff-specific commands afterward.
          uvx --from specify-cli specify integration status --json

      - name: Run Governance Validation
        if: steps.daily_guard.outputs.skip != 'true'
        continue-on-error: false
        run: |
          chmod +x ./freebuff-verify.sh
          ./freebuff-verify.sh

      - name: Create Pull Request
        if: steps.daily_guard.outputs.skip != 'true'
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update GitHub Spec Kit"
          title: "chore: Update GitHub Spec Kit"
          body: |
            Automated update of GitHub Spec Kit CLI, integrations, and extensions.

            This PR was generated automatically by the Spec Kit update workflow.
            The `specify integration status --json` and `./freebuff-verify.sh` governance checks have run.
          branch: "update/spec-kit"
          base: "main"
          delete-branch: true
          reviewers: "davidcollier77-code"

      - name: Record successful update PR submission
        if: steps.daily_guard.outputs.skip != 'true' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          echo "Spec Kit update PR #${PR_NUMBER} was ${PR_OPERATION} successfully."

      - name: Notify on PR submission
        if: steps.daily_guard.outputs.skip != 'true' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          COMMIT_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          DISPATCH_SOURCE: ${{ github.event.inputs.dispatch_source || github.event_name }}
          SCHEDULER_SLOT: ${{ github.event.inputs.scheduler_slot || 'scheduled' }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER="<!-- notify-update:$COMMIT_SHA -->"
          COMMENTS="$(gh pr view "$PR_NUMBER" --json comments -q '.comments[].body' 2>/dev/null || true)"
          if ! printf '%s\n' "$COMMENTS" | grep -Fq "$MARKER"; then
            gh pr comment "$PR_NUMBER" --body "@davidcollier77-code The Spec Kit updater completed and $PR_OPERATION this update PR. Trigger: $DISPATCH_SOURCE ($SCHEDULER_SLOT). Please review the update. Workflow run: $WORKFLOW_URL $MARKER"
          else
            echo "Notification for commit $COMMIT_SHA was already posted."
          fi
