name: Update Spec Kit

on:
  schedule:
    - cron: '5 1 * * 2,5' # Primary scheduled update
      timezone: 'America/Halifax'
    - cron: '5 5 * * 2,5' # Backup scheduled update
      timezone: 'America/Halifax'
    - cron: '5 9 * * 2,5' # Recovery scheduled update
      timezone: 'America/Halifax'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-spec-kit:
    runs-on: ubuntu-latest

    steps:
      - name: Skip if a successful update PR was already submitted today
        id: daily_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_DATE="$(TZ=America/Halifax date +%F)"

          # Find earlier runs of this workflow and check whether one actually
          # created or refreshed an update PR today. The named marker step below
          # is recorded in the run's job steps, so no extra PR comment or file
          # is needed to remember successful completion.
          if ! RUN_LIST="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${{ github.workflow }}/runs?per_page=100" --jq '.workflow_runs[] | [.id, .created_at] | @tsv')"; then
            echo "::warning::Could not inspect earlier workflow runs; proceeding so a recovery attempt remains possible."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS=$'\t' read -r RUN_ID CREATED_AT; do
            [ -n "$RUN_ID" ] || continue
            [ "$RUN_ID" != "$GITHUB_RUN_ID" ] || continue

            RUN_DATE="$(TZ=America/Halifax date -d "$CREATED_AT" +%F)"
            [ "$RUN_DATE" = "$CURRENT_DATE" ] || continue

            if ! JOBS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"; then
              echo "::warning::Could not inspect workflow run ${RUN_ID}; leaving recovery available."
              continue
            fi

            if printf '%s\n' "$JOBS_JSON" | jq -e '
              any(.jobs[]?.steps[]?;
                .name == "Record successful update PR submission" and .conclusion == "success")
            ' >/dev/null; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Run ${RUN_ID} already submitted a successful Spec Kit update PR on ${CURRENT_DATE}; skipping this run."
              exit 0
            fi
          done <<< "$RUN_LIST"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.daily_guard.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js and pnpm
        if: steps.daily_guard.outputs.skip != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'

      - name: Install pnpm
        if: steps.daily_guard.outputs.skip != 'true'
        run: npm install -g pnpm@10.30.3

      - name: Install uv
        if: steps.daily_guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        if: steps.daily_guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Upgrade Spec Kit
        if: steps.daily_guard.outputs.skip != 'true'
        continue-on-error: false
        run: |
          # The CI runner is clean, so run the current published Spec Kit CLI
          # through the official uvx one-time execution path. This avoids relying
          # on a preinstalled "specify" executable and picks up new CLI releases
          # automatically on each scheduled/manual run.
          uvx --from specify-cli specify version

          # Upgrade the installed project integration without --force.
          uvx --from specify-cli specify integration upgrade generic

          # Update all installed Spec Kit extensions without --force.
          uvx --from specify-cli specify extension update

      - name: Validate Integration Status
        if: steps.daily_guard.outputs.skip != 'true'
        continue-on-error: false
        run: uvx --from specify-cli specify integration status --json

      - name: Run Governance Validation
        if: steps.daily_guard.outputs.skip != 'true'
        continue-on-error: false
        run: |
          chmod +x ./jules-verify.sh
          ./jules-verify.sh

      - name: Create Pull Request
        if: steps.daily_guard.outputs.skip != 'true'
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update GitHub Spec Kit"
          title: "chore: Update GitHub Spec Kit"
          body: |
            Automated update of GitHub Spec Kit CLI, integrations, and extensions.

            This PR was generated automatically by the Spec Kit update workflow.
            The `specify integration status --json` and `./jules-verify.sh` governance checks have run.
          branch: "update/spec-kit"
          base: "main"
          delete-branch: true
          reviewers: "davidcollier77-code"

      - name: Record successful update PR submission
        if: steps.daily_guard.outputs.skip != 'true' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          echo "Spec Kit update PR #${PR_NUMBER} was ${PR_OPERATION} successfully."

      - name: Notify on PR update
        if: steps.daily_guard.outputs.skip != 'true' && steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          COMMIT_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          MARKER="<!-- notify-update:$COMMIT_SHA -->"

          # Check if we already commented for this specific commit
          COMMENT_EXISTS=$(gh pr view $PR_NUMBER --json comments -q ".comments[].body" | grep -F "$MARKER" || echo "")

          if [ -z "$COMMENT_EXISTS" ]; then
            gh pr comment $PR_NUMBER --body "@davidcollier77-code The GitHub Spec Kit update PR has been refreshed with new changes and is ready for review. $MARKER"
          else
            echo "Notification for commit $COMMIT_SHA was already posted."
          fi

      - name: Fallback Notification on PR Creation
        if: steps.daily_guard.outputs.skip != 'true' && steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # Check if a review request was successfully made
          HAS_REVIEWER=$(gh pr view $PR_NUMBER --json reviewRequests -q ".reviewRequests | length" || echo "0")

          if [ "$HAS_REVIEWER" = "0" ]; then
            # Fallback to comment mention if reviewer assignment wasn't possible
            gh pr comment $PR_NUMBER --body "@davidcollier77-code A new GitHub Spec Kit update PR has been created and is ready for review."
          fi
