name: Robin Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    name: Robin Code Review
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/robin') ||
          startsWith(github.event.comment.body, '/summary') ||
          startsWith(github.event.comment.body, '/help')
        )
      )
    concurrency:
      group: robin-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.workflow }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate API key and record review start
        id: review_preflight
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ACTOR: ${{ github.actor }}
          PRIMARY_MODEL_OVERRIDE: ${{ vars.ROBIN_LLM_MODEL }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "::warning::OPENROUTER_API_KEY is unavailable; Robin's OpenRouter review and fallback cannot run."
            echo "key_available=false" >> "$GITHUB_OUTPUT"
            echo "primary_model=${PRIMARY_MODEL_OVERRIDE:-openrouter/free}" >> "$GITHUB_OUTPUT"
            echo "start_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "key_available=true" >> "$GITHUB_OUTPUT"
          primary_model="${PRIMARY_MODEL_OVERRIDE:-openrouter/free}"
          if [[ "${primary_model}" == "google/gemma-4-31b-it:free" || "${primary_model}" == "google/gemma-4-26b-a4b-it:free" || "${primary_model}" == "cohere/north-mini-code:free" || "${primary_model}" == "qwen/qwen3-coder:free" || "${primary_model}" == "qwen/qwen3.8-27b:free" || "${primary_model}" == "xingchen-agi/xing4.0-29b-a4b:free" || "${primary_model}" == "dots-studio/dots-3-note-preview:free" ]]; then
            echo "::warning::ROBIN_LLM_MODEL points to a free endpoint tested unsuccessfully; using the OpenRouter free router with a hard time limit."
            primary_model="openrouter/free"
          fi
          echo "primary_model=$primary_model" >> "$GITHUB_OUTPUT"
          echo "start_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          echo "OpenRouter API key is present; its value was not printed."

      - name: Check OpenRouter free-model quota before review
        id: quota_preflight
        if: ${{ steps.review_preflight.outputs.key_available == 'true' }}
        timeout-minutes: 1
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ vars.ROBIN_LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          base_url="${OPENROUTER_BASE_URL%/}"
          status="000"
          curl_rc=0
          status="$(curl --silent --show-error --max-time 12 \
            --output "$workdir/key.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header "Accept: application/json" \
            "${base_url}/key" 2>"$workdir/curl.err")" || curl_rc=$?
          echo "OpenRouter quota preflight: HTTP ${status}; curl exit ${curl_rc}."
          node - "$workdir/key.json" "$status" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const [file, status, output] = process.argv.slice(2);
          const secret = process.env.OPENROUTER_API_KEY;
          const redact = (value) => {
            let text = String(value ?? "");
            if (typeof secret === "string" && secret.length > 0) text = text.replaceAll(secret, "[REDACTED]");
            return text.replace(/Bearer\s+\S+/gi, "Bearer [REDACTED]").replace(/sk-[A-Za-z0-9_-]{8,}/g, "[REDACTED]").slice(0, 300);
          };
          let body = {};
          try { body = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
          let insufficient = false;
          let remainingOutput = "unknown";
          if (status === "200") {
            const data = body.data ?? body;
            const quota = data.free_model_daily_requests ?? data.rate_limit?.free_model_daily_requests;
            const remaining = quota?.remaining == null ? NaN : Number(quota.remaining);
            const limit = quota?.limit == null ? NaN : Number(quota.limit);
            if (Number.isFinite(remaining)) {
              remainingOutput = String(Math.max(0, Math.trunc(remaining)));
              console.log(`OpenRouter free-model daily quota: ${remaining} remaining of ${Number.isFinite(limit) ? limit : "unknown"}.`);
              if (Number.isFinite(remaining) && remaining < 5) {
                insufficient = true;
                console.log("::warning::Fewer than five free requests remain; skip the primary router retries and try the bounded OpenRouter fallback if quota remains.");
              }
            } else {
              console.log("OpenRouter quota preflight could not read a numeric remaining count; leaving the normal Robin path enabled.");
            }
            if (quota?.reset_at != null) {
              const raw = quota.reset_at;
              const date = typeof raw === "number" ? new Date(raw * (raw < 1e12 ? 1000 : 1)) : new Date(raw);
              if (!Number.isNaN(date.getTime())) console.log(`Free-model quota reset time: ${date.toISOString()}.`);
            }
          } else {
            const err = body.error ?? body;
            console.log(`Quota preflight did not receive HTTP 200; status=${status}; error_code=${redact(err.code ?? err.status ?? "")}; message=${redact(err.message ?? body.message ?? "") || "no JSON error detail"}. Normal Robin path remains enabled.`);
          }
          fs.appendFileSync(output, `free_quota_insufficient=${insufficient}\nfree_quota_remaining=${remainingOutput}\n`);
          NODE

      - name: Robin review (OpenRouter free router — hard-capped)
        id: primary_review
        if: ${{ steps.review_preflight.outputs.key_available == 'true' && steps.quota_preflight.outcome == 'success' && (steps.quota_preflight.outputs.free_quota_insufficient != 'true' || (github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/summary') || startsWith(github.event.comment.body, '/help')))) }}
        uses: antongulin/robin@fc0bf915b634bf2f8b88ff1392acefdfb54e28d9
        timeout-minutes: 2
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          llm-base-url: ${{ vars.ROBIN_LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          model: ${{ steps.review_preflight.outputs.primary_model }}
          fail-on-high: false
          request-changes: false
          max-diff-size: "50000"
          max-comments: "15"
          max-output-tokens: "4096"
          reasoning-effort: ""
          llm-timeout-ms: "90000"
          llm-temperature: "0.1"
          min-command-permission: "write"
          review-instructions-file: ".github/code-reviewer.md"
          review-on-synchronize: true
          config-file: ".github/robin.yml"
          use-json-response-mode: ""
          agent-mode: "off"

      # Check for a Robin review on the current PR head before considering a second model attempt.
      - name: Check whether the primary review was already posted
        id: review_guard
        if: ${{ steps.review_preflight.outcome == 'success' && !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_START_EPOCH: ${{ steps.review_preflight.outputs.start_epoch }}
        run: |
          set -euo pipefail
          head_sha="$(timeout 15s gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          review_ids="$(
            timeout 15s env HEAD_SHA="$head_sha" REVIEW_START_EPOCH="$REVIEW_START_EPOCH" gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
                --jq '.[] | select(.commit_id == env.HEAD_SHA and .user.login == "github-actions[bot]" and ((.body // "") | contains("Robin")) and .submitted_at != null and ((.submitted_at | fromdateiso8601) >= (env.REVIEW_START_EPOCH | tonumber))) | .id'
          )"
          if [[ -n "$review_ids" ]]; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A Robin review for the current PR head was already posted in this run; the result check will avoid a duplicate or false failure."
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
            echo "No completed Robin review for the current PR head was found; the final check will report failure unless a late review appears."
          fi

      - name: Validate Cloudflare Workers AI fallback configuration
        id: cloudflare_preflight
        if: ${{ !cancelled() && steps.review_preflight.outcome == 'success' && steps.review_guard.outputs.posted != 'true' && (github.event_name == 'pull_request' || startsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/robin')) }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_FREE_TIER_CONFIRMED: ${{ vars.ROBIN_CLOUDFLARE_AI_FREE_TIER_CONFIRMED }}
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_FREE_TIER_CONFIRMED:-}" != "true" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare fallback disabled until Workers Free plan is explicitly confirmed."
          elif [[ ! "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set CLOUDFLARE_ACCOUNT_ID to the 32-character Cloudflare account ID."
          elif [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add CLOUDFLARE_API_TOKEN with Workers AI Read permission only."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare fallback credentials are configured; token value not printed."
          fi

      - name: Robin review fallback (Cloudflare Workers AI)
        id: fallback_review
        if: ${{ !cancelled() && steps.review_preflight.outcome == 'success' && steps.cloudflare_preflight.outcome == 'success' && steps.cloudflare_preflight.outputs.configured == 'true' && steps.review_guard.outputs.posted != 'true' && (github.event_name == 'pull_request' || startsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/robin')) }}
        uses: antongulin/robin@fc0bf915b634bf2f8b88ff1392acefdfb54e28d9
        timeout-minutes: 2
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          llm-base-url: https://api.cloudflare.com/client/v4/accounts/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/ai/v1
          model: "@cf/zai-org/glm-4.7-flash"
          fail-on-high: false
          request-changes: false
          max-diff-size: "50000"
          max-comments: "15"
          max-output-tokens: "2048"
          reasoning-effort: ""
          llm-timeout-ms: "60000"
          llm-temperature: "0.1"
          min-command-permission: "write"
          review-instructions-file: ".github/code-reviewer.md"
          review-on-synchronize: true
          config-file: ".github/robin.yml"
          use-json-response-mode: ""
          agent-mode: "off"

      - name: Verify Robin review exists for current PR head after fallback
        id: review_final_guard
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_START_EPOCH: ${{ steps.review_preflight.outputs.start_epoch }}
        run: |
          set -euo pipefail
          if [[ -z "${REVIEW_START_EPOCH:-}" ]]; then
            echo "posted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cannot verify a Robin review because the review-start timestamp is missing."
            exit 0
          fi
          head_sha="$(timeout 15s gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          review_ids="$(timeout 15s env HEAD_SHA="$head_sha" REVIEW_START_EPOCH="$REVIEW_START_EPOCH" gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --jq '.[] | select(.commit_id == env.HEAD_SHA and .user.login == "github-actions[bot]" and ((.body // "") | contains("Robin")) and .submitted_at != null and ((.submitted_at | fromdateiso8601) >= (env.REVIEW_START_EPOCH | tonumber))) | .id')"
          if [[ -n "$review_ids" ]]; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
            echo "A Robin review for the exact current PR head was confirmed after the primary/fallback attempts."
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
            echo "No completed Robin review for the exact current PR head was found after the primary/fallback attempts."
          fi

      - name: Diagnose OpenRouter account quota and model response after failed review
        id: openrouter_diagnostic
        if: ${{ (steps.primary_review.outcome == 'failure' || steps.primary_review.outcome == 'skipped') && steps.fallback_review.outcome != 'success' && steps.review_final_guard.outputs.posted != 'true' && !cancelled() }}
        timeout-minutes: 1
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ vars.ROBIN_LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          ROBIN_MODEL: ${{ steps.review_preflight.outputs.primary_model }}
        run: |
          set -uo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          base_url="${OPENROUTER_BASE_URL%/}"

          key_status="000"
          key_curl_rc=0
          key_status="$(curl --silent --show-error --max-time 12 \
            --output "$workdir/key.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header "Accept: application/json" \
            "${base_url}/key" 2>"$workdir/key-curl.err")" || key_curl_rc=$?
          echo "OpenRouter account diagnostic: HTTP ${key_status}; curl exit ${key_curl_rc}."

          # Print only allow-listed account/quota fields or a short, sanitized API error.
          node - "$workdir/key.json" "$key_status" "$workdir/quota-exhausted" <<'NODE'
          const fs = require("node:fs");
          const [file, status, exhaustedPath] = process.argv.slice(2);
          const secret = process.env.OPENROUTER_API_KEY;
          const redact = (value) => {
            let text = String(value ?? "");
            if (typeof secret === "string" && secret.length > 0) {
              text = text.replaceAll(secret, "[REDACTED]");
            }
            return text
              .replace(/Bearer\s+\S+/gi, "Bearer [REDACTED]")
              .replace(/sk-[A-Za-z0-9_-]{8,}/g, "[REDACTED]")
              .slice(0, 400);
          };
          let body = {};
          try { body = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
          if (status === "200") {
            const data = body.data ?? body;
            const quota = data.free_model_daily_requests ?? data.rate_limit?.free_model_daily_requests;
            console.log("OpenRouter key accepted by account endpoint (HTTP 200).");
            if (quota && typeof quota === "object") {
              const remaining = Number(quota.remaining);
              const limit = Number(quota.limit);
              console.log(`Free-model daily quota: remaining=${Number.isFinite(remaining) ? remaining : "unknown"}, limit=${Number.isFinite(limit) ? limit : "unknown"}.`);
              if (Number.isFinite(remaining) && remaining <= 0) {
                fs.writeFileSync(exhaustedPath, "true");
              }
            } else {
              console.log("Free-model daily quota fields were not included by the account endpoint.");
            }
          } else {
            const err = body.error ?? body;
            console.log(`OpenRouter account endpoint did not return HTTP 200 (status ${status}); error_code=${redact(err.code ?? err.status ?? "")}; error_type=${redact(err.type ?? err.metadata?.error_type ?? "")}; message=${redact(err.message ?? body.message ?? "") || "no JSON error detail"}.`);
          }
          NODE

          if [[ "$(cat "$workdir/quota-exhausted" 2>/dev/null || true)" == "true" ]]; then
            echo "::error::OpenRouter reports that the free-model daily quota is exhausted. Skipping the extra inference probe; the Robin review check remains failed."
            exit 0
          fi

          # Make one tiny, bounded request to expose HTTP/provider errors that Robin v2.12.0
          # can currently mask as a generic pre-first-stream "stall". Never log the raw body.
          request_body="$(node - "$ROBIN_MODEL" <<'NODE'
          const model = process.argv[2];
          process.stdout.write(JSON.stringify({
            model,
            messages: [{ role: "user", content: "Reply with exactly OK." }],
            max_tokens: 4,
            stream: false
          }));
          NODE
          )"
          probe_status="000"
          probe_curl_rc=0
          probe_status="$(curl --silent --show-error --max-time 20 \
            --output "$workdir/probe.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$request_body" \
            "${base_url}/chat/completions" 2>"$workdir/probe-curl.err")" || probe_curl_rc=$?
          echo "Minimal completion diagnostic: HTTP ${probe_status}; curl exit ${probe_curl_rc}."
          node - "$workdir/probe.json" "$probe_status" "$ROBIN_MODEL" <<'NODE'
          const fs = require("node:fs");
          const [file, status, requestedModel] = process.argv.slice(2);
          const secret = process.env.OPENROUTER_API_KEY;
          const redact = (value) => {
            let text = String(value ?? "");
            if (typeof secret === "string" && secret.length > 0) {
              text = text.replaceAll(secret, "[REDACTED]");
            }
            return text
              .replace(/Bearer\s+\S+/gi, "Bearer [REDACTED]")
              .replace(/sk-[A-Za-z0-9_-]{8,}/g, "[REDACTED]")
              .slice(0, 400);
          };
          let body = {};
          try { body = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
          if (status === "200") {
            const data = body.data ?? body;
            const content = data.choices?.[0]?.message?.content;
            console.log(`Minimal completion accepted: requested_model=${redact(requestedModel)}, returned_model=${redact(data.model ?? "unknown")}, nonempty_content=${Boolean(typeof content === "string" && content.trim())}.`);
          } else {
            const err = body.error ?? body;
            console.log(`Minimal completion error: status=${status}, code=${redact(err.code ?? err.status ?? "")}, type=${redact(err.type ?? err.metadata?.error_type ?? "")}, provider_code=${redact(err.metadata?.provider_code ?? "")}, message=${redact(err.message ?? body.message ?? "") || "no JSON error detail"}.`);
          }
          NODE
          # This step intentionally reports diagnostics but never changes the failing review result.
          exit 0

      - name: Record and enforce review outcome
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_OUTCOME: ${{ steps.review_preflight.outcome }}
          PRIMARY_OUTCOME: ${{ steps.primary_review.outcome }}
          FALLBACK_OUTCOME: ${{ steps.fallback_review.outcome }}
          KEY_AVAILABLE: ${{ steps.review_preflight.outputs.key_available }}
          FREE_QUOTA_INSUFFICIENT: ${{ steps.quota_preflight.outputs.free_quota_insufficient }}
          FREE_QUOTA_REMAINING: ${{ steps.quota_preflight.outputs.free_quota_remaining }}
          PRIMARY_MODEL: ${{ steps.review_preflight.outputs.primary_model }}
          FALLBACK_MODEL: "@cf/zai-org/glm-4.7-flash"
          CLOUDFLARE_CONFIGURED: ${{ steps.cloudflare_preflight.outputs.configured }}
          PRE_GUARD_OUTCOME: ${{ steps.review_guard.outcome }}
          PRE_GUARD_POSTED: ${{ steps.review_guard.outputs.posted }}
          FINAL_GUARD_OUTCOME: ${{ steps.review_final_guard.outcome }}
          FINAL_GUARD_POSTED: ${{ steps.review_final_guard.outputs.posted }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body != null && startsWith(github.event.comment.body, '/') && github.event.comment.body || '' }}
          REVIEW_START_EPOCH: ${{ steps.review_preflight.outputs.start_epoch }}
        run: |
          set -euo pipefail
          {
            echo "## Robin review outcome"
            echo
            echo "- Credential preflight: ${KEY_OUTCOME:-not run}"
            echo "- Primary review: ${PRIMARY_OUTCOME:-not run}"
            echo "- Primary model: ${PRIMARY_MODEL:-not set}"
            echo "- Fallback review: ${FALLBACK_OUTCOME:-not run}"
            echo "- Fallback provider: Cloudflare Workers AI"
            echo "- Fallback model: ${FALLBACK_MODEL:-not set}"
            echo "- Cloudflare fallback configured: ${CLOUDFLARE_CONFIGURED:-false}"
            echo "- Free quota remaining at preflight: ${FREE_QUOTA_REMAINING:-unknown}"
            echo "- Pre-fallback review guard: ${PRE_GUARD_OUTCOME:-not run} (posted=${PRE_GUARD_POSTED:-unknown})"
            echo "- Final current-head review guard: ${FINAL_GUARD_OUTCOME:-not run} (posted=${FINAL_GUARD_POSTED:-unknown})"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$KEY_OUTCOME" != "success" ]]; then
            echo "::error::Review preflight failed; no reviewer outcome can be trusted."
            exit 1
          fi

          # /summary and /help are Robin commands, but are not code-review requests.
          COMMENT_BODY="${COMMENT_BODY:-}"
          if [[ "$EVENT_NAME" == "issue_comment" && "$PRIMARY_OUTCOME" == "success" && "$COMMENT_BODY" != /review* && "$COMMENT_BODY" != /robin* ]]; then
            echo "Robin command handled successfully; no code-review fallback is required for this command."
            exit 0
          fi

          if [[ "$FINAL_GUARD_POSTED" == "true" ]]; then
            echo "A real Robin review for the exact current PR head was verified; accepting the primary OpenRouter or Cloudflare Workers AI fallback review."
            exit 0
          fi

          if [[ "$KEY_AVAILABLE" != "true" ]]; then
            echo "::error::OpenRouter key unavailable and Cloudflare did not post a qualifying review for the current PR head."
            exit 1
          fi
          if [[ "$FREE_QUOTA_REMAINING" == "0" ]]; then
            echo "::error::OpenRouter quota is zero and Cloudflare did not produce a qualifying review for the current PR head."
            exit 1
          fi
          if [[ "${CLOUDFLARE_CONFIGURED:-false}" != "true" ]]; then
            echo "::error::Cloudflare fallback is disabled or not configured. Confirm Workers Free plan, set ROBIN_CLOUDFLARE_AI_FREE_TIER_CONFIRMED=true, define CLOUDFLARE_ACCOUNT_ID, and add CLOUDFLARE_API_TOKEN with Workers AI Read only."
            exit 1
          fi
          if [[ -z "${REVIEW_START_EPOCH:-}" ]]; then
            echo "::error::Review-start timestamp is unset; cannot verify a review for the current PR head."
            exit 1
          fi

          echo "::error::Neither Robin's primary OpenRouter attempt nor Cloudflare Workers AI fallback produced a verifiable review for the current PR head."
          exit 1
