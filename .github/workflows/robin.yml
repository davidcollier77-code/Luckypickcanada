name: Robin Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    name: Robin Code Review
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/robin') ||
          startsWith(github.event.comment.body, '/summary') ||
          startsWith(github.event.comment.body, '/help')
        )
      )
    concurrency:
      group: robin-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.workflow }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Validate API key and record review start
        id: review_preflight
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ACTOR: ${{ github.actor }}
          PRIMARY_MODEL_OVERRIDE: ${{ vars.ROBIN_LLM_MODEL }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "::warning::OPENROUTER_API_KEY is unavailable; Robin primary review will be skipped and the backup reviewer will be requested."
            echo "key_available=false" >> "$GITHUB_OUTPUT"
            echo "primary_model=${PRIMARY_MODEL_OVERRIDE:-openrouter/free}" >> "$GITHUB_OUTPUT"
            echo "start_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "key_available=true" >> "$GITHUB_OUTPUT"
          primary_model="${PRIMARY_MODEL_OVERRIDE:-openrouter/free}"
          if [[ "${primary_model}" == "google/gemma-4-31b-it:free" || "${primary_model}" == "google/gemma-4-26b-a4b-it:free" || "${primary_model}" == "cohere/north-mini-code:free" || "${primary_model}" == "qwen/qwen3-coder:free" || "${primary_model}" == "qwen/qwen3.8-27b:free" || "${primary_model}" == "xingchen-agi/xing4.0-29b-a4b:free" || "${primary_model}" == "dots-studio/dots-3-note-preview:free" ]]; then
            echo "::warning::ROBIN_LLM_MODEL points to a free endpoint tested unsuccessfully; using the OpenRouter free router with a hard time limit."
            primary_model="openrouter/free"
          fi
          echo "primary_model=$primary_model" >> "$GITHUB_OUTPUT"
          echo "start_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          echo "OpenRouter API key is present; its value was not printed."

      - name: Check OpenRouter free-model quota before review
        id: quota_preflight
        if: ${{ steps.review_preflight.outputs.key_available == 'true' }}
        timeout-minutes: 1
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ vars.ROBIN_LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
        run: |
          set -uo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          base_url="${OPENROUTER_BASE_URL%/}"
          status="000"
          curl_rc=0
          status="$(curl --silent --show-error --max-time 12 \
            --output "$workdir/key.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header "Accept: application/json" \
            "${base_url}/key" 2>"$workdir/curl.err")" || curl_rc=$?
          echo "OpenRouter quota preflight: HTTP ${status}; curl exit ${curl_rc}."
          node - "$workdir/key.json" "$status" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const [file, status, output] = process.argv.slice(2);
          const secret = process.env.OPENROUTER_API_KEY;
          const redact = (value) => {
            let text = String(value ?? "");
            if (typeof secret === "string" && secret.length > 0) text = text.replaceAll(secret, "[REDACTED]");
            return text.replace(/Bearer\\s+\\S+/gi, "Bearer [REDACTED]").replace(/sk-[A-Za-z0-9_-]{8,}/g, "[REDACTED]").slice(0, 300);
          };
          let body = {};
          try { body = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
          let insufficient = false;
          if (status === "200") {
            const data = body.data ?? body;
            const quota = data.free_model_daily_requests ?? data.rate_limit?.free_model_daily_requests;
            const remaining = quota?.remaining == null ? NaN : Number(quota.remaining);
            const limit = quota?.limit == null ? NaN : Number(quota.limit);
            if (Number.isFinite(remaining)) {
              console.log(`OpenRouter free-model daily quota: ${remaining} remaining of ${Number.isFinite(limit) ? limit : "unknown"}.`);
              if (Number.isFinite(remaining) && remaining < 5) {
                insufficient = true;
                console.log("::warning::Fewer than five free requests remain; skipping Robin's five-attempt retry budget and requesting the backup reviewer.");
              }
            } else {
              console.log("OpenRouter quota preflight could not read a numeric remaining count; leaving the normal Robin path enabled.");
            }
            if (quota?.reset_at != null) {
              const raw = quota.reset_at;
              const date = typeof raw === "number" ? new Date(raw * (raw < 1e12 ? 1000 : 1)) : new Date(raw);
              if (!Number.isNaN(date.getTime())) console.log(`Free-model quota reset time: ${date.toISOString()}.`);
            }
          } else {
            const err = body.error ?? body;
            console.log(`Quota preflight did not receive HTTP 200; status=${status}; error_code=${redact(err.code ?? err.status ?? "")}; message=${redact(err.message ?? body.message ?? "") || "no JSON error detail"}. Normal Robin path remains enabled.`);
          }
          fs.appendFileSync(output, `free_quota_insufficient=${insufficient}\n`);
          NODE

      - name: Robin review (OpenRouter free router — hard-capped)
        id: primary_review
        if: ${{ steps.review_preflight.outputs.key_available == 'true' && steps.quota_preflight.outputs.free_quota_insufficient != 'true' }}
        uses: antongulin/robin@fc0bf915b634bf2f8b88ff1392acefdfb54e28d9
        timeout-minutes: 2
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          llm-base-url: ${{ vars.ROBIN_LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          model: ${{ steps.review_preflight.outputs.primary_model }}
          fail-on-high: false
          request-changes: false
          max-diff-size: "50000"
          max-comments: "15"
          max-output-tokens: "4096"
          reasoning-effort: ""
          llm-timeout-ms: "90000"
          llm-temperature: "0.1"
          min-command-permission: "write"
          review-instructions-file: ".github/code-reviewer.md"
          review-on-synchronize: true
          config-file: ".github/robin.yml"
          use-json-response-mode: ""
          agent-mode: "off"

      - name: Diagnose OpenRouter account quota and model response after failed review
        id: openrouter_diagnostic
        if: ${{ steps.primary_review.outcome == 'failure' && !cancelled() }}
        timeout-minutes: 1
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ vars.ROBIN_LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          ROBIN_MODEL: ${{ steps.review_preflight.outputs.primary_model }}
        run: |
          set -uo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          base_url="${OPENROUTER_BASE_URL%/}"

          key_status="000"
          key_curl_rc=0
          key_status="$(curl --silent --show-error --max-time 12 \
            --output "$workdir/key.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header "Accept: application/json" \
            "${base_url}/key" 2>"$workdir/key-curl.err")" || key_curl_rc=$?
          echo "OpenRouter account diagnostic: HTTP ${key_status}; curl exit ${key_curl_rc}."

          # Print only allow-listed account/quota fields or a short, sanitized API error.
          node - "$workdir/key.json" "$key_status" "$workdir/quota-exhausted" <<'NODE'
          const fs = require("node:fs");
          const [file, status, exhaustedPath] = process.argv.slice(2);
          const secret = process.env.OPENROUTER_API_KEY;
          const redact = (value) => {
            let text = String(value ?? "");
            if (typeof secret === "string" && secret.length > 0) {
              text = text.replaceAll(secret, "[REDACTED]");
            }
            return text
              .replace(/Bearer\\s+\\S+/gi, "Bearer [REDACTED]")
              .replace(/sk-[A-Za-z0-9_-]{8,}/g, "[REDACTED]")
              .slice(0, 400);
          };
          let body = {};
          try { body = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
          if (status === "200") {
            const data = body.data ?? body;
            const quota = data.free_model_daily_requests ?? data.rate_limit?.free_model_daily_requests;
            console.log("OpenRouter key accepted by account endpoint (HTTP 200).");
            if (quota && typeof quota === "object") {
              const remaining = Number(quota.remaining);
              const limit = Number(quota.limit);
              console.log(`Free-model daily quota: remaining=${Number.isFinite(remaining) ? remaining : "unknown"}, limit=${Number.isFinite(limit) ? limit : "unknown"}.`);
              if (Number.isFinite(remaining) && remaining <= 0) {
                fs.writeFileSync(exhaustedPath, "true");
              }
            } else {
              console.log("Free-model daily quota fields were not included by the account endpoint.");
            }
          } else {
            const err = body.error ?? body;
            console.log(`OpenRouter account endpoint did not return HTTP 200 (status ${status}); error_code=${redact(err.code ?? err.status ?? "")}; error_type=${redact(err.type ?? err.metadata?.error_type ?? "")}; message=${redact(err.message ?? body.message ?? "") || "no JSON error detail"}.`);
          }
          NODE

          if [[ "$(cat "$workdir/quota-exhausted" 2>/dev/null || true)" == "true" ]]; then
            echo "::error::OpenRouter reports that the free-model daily quota is exhausted. Skipping the extra inference probe; the Robin review check remains failed."
            exit 0
          fi

          # Make one tiny, bounded request to expose HTTP/provider errors that Robin v2.12.0
          # can currently mask as a generic pre-first-stream "stall". Never log the raw body.
          request_body="$(ROBIN_MODEL="$ROBIN_MODEL" node -e 'process.stdout.write(JSON.stringify({model:process.env.ROBIN_MODEL,messages:[{role:"user",content:"Reply with exactly OK."}],max_tokens:4,stream:false}))')"
          probe_status="000"
          probe_curl_rc=0
          probe_status="$(curl --silent --show-error --max-time 20 \
            --output "$workdir/probe.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$request_body" \
            "${base_url}/chat/completions" 2>"$workdir/probe-curl.err")" || probe_curl_rc=$?
          echo "Minimal completion diagnostic: HTTP ${probe_status}; curl exit ${probe_curl_rc}."
          node - "$workdir/probe.json" "$probe_status" "$ROBIN_MODEL" <<'NODE'
          const fs = require("node:fs");
          const [file, status, requestedModel] = process.argv.slice(2);
          const secret = process.env.OPENROUTER_API_KEY;
          const redact = (value) => {
            let text = String(value ?? "");
            if (typeof secret === "string" && secret.length > 0) {
              text = text.replaceAll(secret, "[REDACTED]");
            }
            return text
              .replace(/Bearer\\s+\\S+/gi, "Bearer [REDACTED]")
              .replace(/sk-[A-Za-z0-9_-]{8,}/g, "[REDACTED]")
              .slice(0, 400);
          };
          let body = {};
          try { body = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
          if (status === "200") {
            const data = body.data ?? body;
            const content = data.choices?.[0]?.message?.content;
            console.log(`Minimal completion accepted: requested_model=${redact(requestedModel)}, returned_model=${redact(data.model ?? "unknown")}, nonempty_content=${Boolean(typeof content === "string" && content.trim())}.`);
          } else {
            const err = body.error ?? body;
            console.log(`Minimal completion error: status=${status}, code=${redact(err.code ?? err.status ?? "")}, type=${redact(err.type ?? err.metadata?.error_type ?? "")}, provider_code=${redact(err.metadata?.provider_code ?? "")}, message=${redact(err.message ?? body.message ?? "") || "no JSON error detail"}.`);
          }
          NODE
          # This step intentionally reports diagnostics but never changes the failing review result.
          exit 0

      - name: Request and verify Amazon Q fallback review
        id: q_fallback
        if: ${{ !cancelled() && (steps.review_preflight.outputs.key_available != 'true' || steps.quota_preflight.outputs.free_quota_insufficient == 'true' || steps.primary_review.outcome == 'failure' || steps.primary_review.outcome == 'cancelled' || steps.primary_review.outcome == 'skipped') }}
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          echo "review_found=false" >> "$GITHUB_OUTPUT"
          head_sha="$(timeout 15s gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"

          find_q_review() {
            timeout 15s env HEAD_SHA="$head_sha" gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --jq '.[] | select(.commit_id == env.HEAD_SHA and .user.login == "amazon-q-developer[bot]" and .state != "DISMISSED" and ((.body // "") | test("Code Review Summary|Review Summary|Full Review"; "i"))) | .id'
          }

          q_review_ids="$(find_q_review)"
          if [[ -n "$q_review_ids" ]]; then
            echo "review_found=true" >> "$GITHUB_OUTPUT"
            echo "A substantive Amazon Q review already exists for the exact current head; no duplicate review was requested."
            exit 0
          fi

          existing_request="$(timeout 15s env HEAD_SHA="$head_sha" gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("/q review")) and ((.body // "") | contains(env.HEAD_SHA))) | .id')"
          if [[ -z "$existing_request" ]]; then
            comment_body="$(printf '/q review\n\nAutomated backup review requested because Robin could not review this pull request (OpenRouter free quota unavailable or primary review failed).\nTarget head: %s\nA valid review for this exact commit is required; no check will pass without one.\n' "$head_sha")"
            timeout 15s gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$comment_body" >/dev/null
            echo "Requested the installed Amazon Q reviewer for head $head_sha."
          else
            echo "A request for the Amazon Q reviewer already exists for this exact head; waiting for its result."
          fi

          # Amazon Q can take a little time. Bound the wait, and only accept a real review
          # whose commit_id equals the PR's current head and whose body contains a review summary.
          deadline=$((SECONDS + 90))
          while (( SECONDS < deadline )); do
            q_review_ids="$(find_q_review)"
            if [[ -n "$q_review_ids" ]]; then
              echo "review_found=true" >> "$GITHUB_OUTPUT"
              echo "Amazon Q posted a substantive review for the exact current head."
              exit 0
            fi
            sleep 8
          done

          echo "::warning::Amazon Q did not post a qualifying review for head $head_sha within the bounded wait. The final review gate will remain failed."
          exit 0

      - name: Check whether the primary review was already posted
        id: review_guard
        if: ${{ (steps.primary_review.outcome == 'failure' || steps.primary_review.outcome == 'cancelled') && !cancelled() }}
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_START_EPOCH: ${{ steps.review_preflight.outputs.start_epoch }}
        run: |
          set -euo pipefail
          head_sha="$(timeout 15s gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          review_ids="$(
            timeout 15s env HEAD_SHA="$head_sha" REVIEW_START_EPOCH="$REVIEW_START_EPOCH" gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
                --jq '.[] | select(.commit_id == env.HEAD_SHA and .user.login == "github-actions[bot]" and ((.body // "") | contains("Robin")) and .submitted_at != null and ((.submitted_at | fromdateiso8601) >= (env.REVIEW_START_EPOCH | tonumber))) | .id'
          )"
          if [[ -n "$review_ids" ]]; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A Robin review for the current PR head was already posted in this run; the result check will avoid a duplicate or false failure."
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
            echo "No completed Robin review for the current PR head was found; the final check will report failure unless a late review appears."
          fi

      - name: Record and enforce review outcome
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_OUTCOME: ${{ steps.review_preflight.outcome }}
          PRIMARY_OUTCOME: ${{ steps.primary_review.outcome }}
          KEY_AVAILABLE: ${{ steps.review_preflight.outputs.key_available }}
          FREE_QUOTA_INSUFFICIENT: ${{ steps.quota_preflight.outputs.free_quota_insufficient }}
          Q_FALLBACK_FOUND: ${{ steps.q_fallback.outputs.review_found }}
          GUARD_OUTCOME: ${{ steps.review_guard.outcome }}
          GUARD_POSTED: ${{ steps.review_guard.outputs.posted }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_START_EPOCH: ${{ steps.review_preflight.outputs.start_epoch }}
        run: |
          set -euo pipefail
          {
            echo "## Robin review outcome"
            echo
            echo "- Credential preflight: ${KEY_OUTCOME:-not run}"
            echo "- Primary review: ${PRIMARY_OUTCOME:-not run}"
            echo "- Duplicate-review guard: ${GUARD_OUTCOME:-not needed}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$KEY_OUTCOME" != "success" ]]; then
            echo "::error::The review preflight step itself failed; no reviewer outcome can be trusted."
            exit 1
          fi
          if [[ "$PRIMARY_OUTCOME" == "success" ]]; then
            echo "Primary Robin review completed successfully."
            exit 0
          fi
          if [[ "$GUARD_POSTED" == "true" ]]; then
            echo "The primary action ended abnormally after posting a Robin review; no duplicate was created."
            exit 0
          fi
          if [[ "$Q_FALLBACK_FOUND" == "true" ]]; then
            echo "A substantive Amazon Q review for the exact current PR head was verified. Accepting this real backup review; no missing review is being waived."
            exit 0
          fi
          if [[ "$KEY_AVAILABLE" != "true" ]]; then
            echo "::error::OPENROUTER_API_KEY is unavailable and no qualifying Amazon Q fallback review was posted."
            exit 1
          fi
          if [[ "$FREE_QUOTA_INSUFFICIENT" == "true" ]]; then
            echo "::error::OpenRouter free-model daily quota is exhausted or below the five-attempt budget, and no qualifying Amazon Q fallback review was posted."
            exit 1
          fi

          if [[ -z "${REVIEW_START_EPOCH:-}" ]]; then
            echo "::error::REVIEW_START_EPOCH is unset (preflight was cancelled before it ran); cannot check for late reviews."
            exit 1
          fi
          head_sha="$(timeout 15s gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          late_review_ids="$(
            timeout 15s env HEAD_SHA="$head_sha" REVIEW_START_EPOCH="$REVIEW_START_EPOCH" gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
                --jq '.[] | select(.commit_id == env.HEAD_SHA and .user.login == "github-actions[bot]" and ((.body // "") | contains("Robin")) and .submitted_at != null and ((.submitted_at | fromdateiso8601) >= (env.REVIEW_START_EPOCH | tonumber))) | .id'
          )"
          if [[ -n "$late_review_ids" ]]; then
            echo "A Robin review was posted before timeout; treating the job as recovered."
            exit 0
          fi

          echo "::error::Robin review did not complete within its bounded attempt. No review was posted; the check remains failed."
          exit 1
