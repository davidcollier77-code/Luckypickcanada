# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '35 1 * * 1'

# Prevent overlapping scans from racing while appending to the shared report.
concurrency:
  group: devskim-alerts-main
  cancel-in-progress: false

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@a6b6966a33b497cd3ae2ebc406edf8f4cc2feec6 # v1.0.15
        with:
          output-filename: devskim-alerts.sarif

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: devskim-alerts.sarif

      - name: Append new DevSkim findings to shared report
        id: append-findings
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          sarif_path = Path("devskim-alerts.sarif")
          report_path = Path("devskim-alerts.md")
          report = report_path.read_text(encoding="utf-8") if report_path.exists() else (
              "# DevSkim alerts\n\n"
              "This is the running list of distinct findings detected by DevSkim. "
              "New findings are appended once; entries are not removed automatically. "
              "Remove an entry only after its remediation has been verified.\n\n"
              "<!-- DevSkim findings are appended below this line. -->\n"
          )
          known = set(re.findall(r"<!-- devskim-id:([0-9a-f]{20}) -->", report))
          data = json.loads(sarif_path.read_text(encoding="utf-8"))
          additions = []

          def clean(value):
              return re.sub(r"\s+", " ", str(value or "")).replace("|", "\\|").strip()

          for run in data.get("runs", []):
              for result in run.get("results", []):
                  rule_id = result.get("ruleId", "unknown")
                  message = clean(result.get("message", {}).get("text", "No message provided"))
                  level = clean(result.get("level", "unspecified"))
                  locations = result.get("locations", [])
                  location = locations[0] if locations else {}
                  physical = location.get("physicalLocation", {})
                  uri = physical.get("artifactLocation", {}).get("uri", "Location not provided")
                  region = physical.get("region", {})
                  line = region.get("startLine")
                  where = f"{uri}:{line}" if line else uri
                  fingerprints = result.get("partialFingerprints") or result.get("fingerprints") or {}
                  stable_fingerprint = (
                      fingerprints.get("primaryLocationLineHash")
                      or fingerprints.get("primaryLocationStartColumnFingerprint")
                      or ""
                  )
                  identity = "\\0".join([
                      rule_id, uri, str(stable_fingerprint or line or ""), message
                  ])
                  finding_id = hashlib.sha256(identity.encode("utf-8")).hexdigest()[:20]
                  if finding_id in known:
                      continue
                  known.add(finding_id)
                  additions.append(
                      f"- **{level.upper()} — {clean(rule_id)}** — "
                      f"`{clean(where)}` — {message} "
                      f"<!-- devskim-id:{finding_id} -->"
                  )

          if additions:
              if "<!-- DevSkim findings are appended below this line. -->" not in report:
                  report = report.rstrip() + "\n"
              report = report.rstrip() + "\n\n" + "\n".join(additions) + "\n"
              report_path.write_text(report, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"new_count={len(additions)}\n")
          print(f"Appended {len(additions)} new DevSkim finding(s).")
          PY

      - name: Commit updated alert report
        if: steps.append-findings.outputs.new_count != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devskim-alerts.md
          git commit -m "chore: record new DevSkim alerts"
          git push origin HEAD:main

      - name: Notify about new DevSkim alerts
        if: success() && steps.append-findings.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_COUNT: ${{ steps.append-findings.outputs.new_count }}
          REPORT_URL: https://github.com/${{ github.repository }}/blob/main/devskim-alerts.md
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          body="@davidcollier77-code **${NEW_COUNT} new DevSkim finding(s) added.**"
          body+=$'\n\n'
          body+="The shared report has been updated: ${REPORT_URL}"
          body+=$'\n\n'
          body+="Scan details: ${RUN_URL}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1556/comments" -f body="$body"
