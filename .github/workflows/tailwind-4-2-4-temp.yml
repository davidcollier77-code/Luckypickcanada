name: Temporary Tailwind 4.2.4 Verification

on:
  push:
    branches:
      - chore/tailwind-4-2-4
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10.30.3

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify Tailwind package graph
        run: |
          pnpm list tailwindcss @tailwindcss/postcss postcss tailwind-merge --depth 0
          node - <<'NODE'
          const fs = require('fs');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          if (!lock.includes('tailwindcss@4.2.4')) {
            console.error('Tailwind 4.2.4 is not present in pnpm-lock.yaml');
            process.exit(1);
          }
          if (!lock.includes('@tailwindcss/postcss@4.2.4')) {
            console.error('@tailwindcss/postcss 4.2.4 is not present in pnpm-lock.yaml');
            process.exit(1);
          }
          console.log('Tailwind 4.2.4 lockfile entries verified');
          NODE

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailwind-4-2-4-lockfile
          path: pnpm-lock.yaml

      - name: Clear build output
        run: rm -rf .next/cache .open-next

      - name: Build Next.js app
        run: pnpm run build

      - name: Build OpenNext for Cloudflare
        run: pnpm exec opennextjs-cloudflare build

      - name: Verify compiled Tailwind CSS
        run: |
          css_dir=".open-next/assets/_next/static/css"
          test -d "$css_dir"
          css_file="$(find "$css_dir" -type f -name '*.css' -print -quit)"
          test -n "$css_file"

          if grep -R -n -F '@tailwind base;' "$css_dir"; then
            echo "UNPROCESSED TAILWIND DIRECTIVE DETECTED"
            exit 1
          fi

          grep -R -n -F '.bg-linear-to-r' "$css_dir" >/dev/null
          grep -R -n -F '.shadow-xs' "$css_dir" >/dev/null
          grep -R -n -F '.font-playfair' "$css_dir" >/dev/null
          grep -R -n -F '.animate-shimmer' "$css_dir" >/dev/null

          echo "TAILWIND CSS COMPILED AND KEY CUSTOM UTILITIES PRESENT"

      - name: Verify OpenNext artifacts
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets

      - name: Measure build artifacts
        run: |
          for dir in .next .open-next; do
            size_mb="$(du -sm "$dir" | cut -f1)"
            echo "$dir size: ${size_mb} MB"
            if [ "$size_mb" -ge 495 ]; then
              echo "BUILD SIZE LIMIT EXCEEDED: $dir is ${size_mb} MB (limit < 495 MB)"
              exit 1
            fi
          done

      - name: Wrangler build validation (no deploy)
        run: pnpm exec wrangler build --config ./wrangler.jsonc

      - name: Assert lockfile remains clean
        run: git diff --exit-code -- pnpm-lock.yaml
