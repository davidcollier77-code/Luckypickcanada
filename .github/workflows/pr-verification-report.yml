name: PR Verification Report

# Publishes ONE consolidated report with exactly seven checker categories:
#   1. QA Checker
#   2. DevSkim
#   3. PR Scope Verification
#   4. Protected File Changes
#   5. Verification Integrity
#   6. Governance and Workflow Verification
#   7. Dependency Health & Vulnerability Review
#
# The report is updated in place (one sticky comment) and always describes the
# current pull request HEAD. Supporting results keep their detailed findings:
# changed-code review, test quality, performance, the full unit suite, the
# TypeScript check, the production build and both Playwright shards.
#
# pull_request_target, issue_comment and workflow_run only: the pull request's
# code is never checked out or executed. Only the trusted base branch is checked
# out. The issue_comment trigger refreshes the report after an owner approval so
# a digest approval replaces the previous FAILED result instead of leaving it
# stale. Because those triggers fire before sibling checks finish, the job waits
# (bounded) for the current head's applicable checks before reading evidence.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]
  workflow_run:
    workflows:
      - Visual QA
      - DevSkim
      - Validate OpenNext Repair
      - PR Scope Verification
      - Protected File Changes
      - Verification Integrity
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: read
  security-events: read
  # The seventh category reads Dependabot alerts. security-events covers code
  # scanning only, so this separate read-only permission is required.
  vulnerability-alerts: read

# One report per branch or pull request, whatever event refreshed it, so a PR
# event, an approval comment and a workflow_run completion cannot publish two
# reports at the same time.
concurrency:
  group: pr-verification-report-${{ github.event.pull_request.head.ref || github.event.issue.number || github.event.workflow_run.head_branch || github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  REPOSITORY: ${{ github.repository }}

jobs:
  report:
    name: PR verification report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # An issue_comment refresh is owner-only and must be one of the digest
    # approval commands; every other comment leaves the report untouched.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/approve-'))
    steps:
      - name: Checkout trusted base-branch checker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      # workflow_run events raised by pull_request_target workflows do not carry
      # pull_requests[]. The head branch resolves the open pull request instead.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          WORKFLOW_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          number="${EVENT_PR:-}"
          if [[ -z "$number" && -n "${EVENT_ISSUE:-}" ]]; then
            number="$EVENT_ISSUE"
          fi
          if [[ -z "$number" && -n "${WORKFLOW_PR:-}" ]]; then
            number="$WORKFLOW_PR"
          fi
          if [[ -z "$number" && -n "${WORKFLOW_BRANCH:-}" ]]; then
            owner="${REPOSITORY%%/*}"
            number="$(gh api --paginate \
              "repos/${REPOSITORY}/pulls?state=open&head=${owner}:${WORKFLOW_BRANCH}" \
              --jq '.[0].number // empty' 2>/dev/null || true)"
            if [[ -z "$number" ]]; then
              number="$(gh pr list --repo "$REPOSITORY" --head "$WORKFLOW_BRANCH" \
                --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
            fi
          fi
          if [[ -z "$number" ]]; then
            echo "::warning::No open pull request is associated with this run, so no verification report is published."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Trigger events arrive when the pull request is opened or edited and
      # whenever a single checker finishes, so an early run of a head usually
      # sees its sibling checks still queued or running. Wait, bounded, on the
      # current head before reading any evidence: the audit and the renderer
      # below then describe settled results instead of publishing a NOT RUN
      # placeholder that a later refresh has to replace. The wait re-reads the
      # pull request on every poll, so a commit that lands mid-wait is followed
      # rather than reported against the previous head, and it returns at the
      # deadline so a missing or never-finishing check cannot stall the report.
      # It is not a gate: the audit, the renderer and the status gate below still
      # decide the published result.
      - name: Wait for current-head checks to settle
        id: wait
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set +e
          python3 .github/scripts/verify_pr_verification_status.py \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --wait-seconds 600 \
            --poll-interval 15 \
            > "$RUNNER_TEMP/wait.md" 2>&1
          status=$?
          set -e
          echo "wait_status=$status" >> "$GITHUB_OUTPUT"
          # 0 = settled and verified, 1 = settled but incomplete, 2 = audit
          # error. None of them stops the report; the evidence below is audited
          # and published with its real status.
          if [[ "$status" -eq 2 ]]; then
            cat "$RUNNER_TEMP/wait.md" >&2
          fi

      - name: Fetch pull request, diff, comments and current-head checks
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            | jq 'add // []' > "$RUNNER_TEMP/files.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq 'add // []' > "$RUNNER_TEMP/comments.json"
          head_sha="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          # Paginate: a busy head can carry more than 100 check runs, and a
          # missing page would be reported as NOT RUN instead of its real result.
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${head_sha}/check-runs?per_page=100&filter=all" \
            | jq '[.[].check_runs[]]' > "$RUNNER_TEMP/checks.json"
          if ! gh api \
            "repos/${REPOSITORY}/code-scanning/alerts?pr=${PR_NUMBER}&state=open&per_page=100" \
            > "$RUNNER_TEMP/alerts.json" 2> "$RUNNER_TEMP/alerts.err"; then
            printf '{"message": "the code-scanning alerts could not be read"}\n' \
              > "$RUNNER_TEMP/alerts.json"
            cat "$RUNNER_TEMP/alerts.err" >&2 || true
          fi
          # Dependency advisories feed the seventh category. They come from the
          # advisory database, not from a Dependabot update run, so the review
          # works whether or not Dependabot has opened a pull request.
          if ! gh api --paginate --slurp \
            "repos/${REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            2> "$RUNNER_TEMP/dependency-alerts.err" \
            | jq 'add // []' > "$RUNNER_TEMP/dependency-alerts.json"; then
            printf '{"message": "the Dependabot alert list could not be read"}\n' \
              > "$RUNNER_TEMP/dependency-alerts.json"
            cat "$RUNNER_TEMP/dependency-alerts.err" >&2 || true
          fi

      # Build and browser applicability is recomputed from the trusted base
      # classifier and this pull request's actual file list. The renderer and
      # the audit receive the same decision, so a skipped check is distinguished
      # from a check that could not apply.
      - name: Compute change applicability from the trusted base
        id: applicability
        if: steps.pr.outputs.number != ''
        # A missing classifier on the trusted base (rollout) or an API failure
        # must not suppress the report; empty outputs fall back to "unknown".
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/compute-applicability.sh \
            "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/files.json" >> "$GITHUB_OUTPUT"

      # The audit matches every check run to the current head SHA and reports
      # skipped, cancelled, stale and missing results as NOT RUN. It exits
      # non-zero when verification is not complete, which is a result this
      # report must publish rather than a reason to stop.
      - name: Audit current-head verification
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set +e
          python3 .github/scripts/verify_pr_verification_status.py \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --build-required "${{ steps.applicability.outputs.build_required || 'unknown' }}" \
            --visual-required "${{ steps.applicability.outputs.visual_required || 'unknown' }}" \
            --json "$RUNNER_TEMP/verification.json" \
            --summary "$RUNNER_TEMP/verification.md"
          status=$?
          set -e
          if [[ -f "$RUNNER_TEMP/verification.md" ]]; then
            cat "$RUNNER_TEMP/verification.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "audit_status=$status" >> "$GITHUB_OUTPUT"

      - name: Render the seven-category report
        id: render
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set +e
          PYTHONPATH=.github/scripts python3 .github/scripts/pr_verification_report.py \
            --pull-request "$RUNNER_TEMP/pr.json" \
            --files "$RUNNER_TEMP/files.json" \
            --comments "$RUNNER_TEMP/comments.json" \
            --checks "$RUNNER_TEMP/checks.json" \
            --verification "$RUNNER_TEMP/verification.json" \
            --alerts "$RUNNER_TEMP/alerts.json" \
            --dependency-alerts "$RUNNER_TEMP/dependency-alerts.json" \
            --owner "$OWNER" \
            --comment "$RUNNER_TEMP/comment.md" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json "$RUNNER_TEMP/report.json"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # A build/render error must never leave the previous PASSED comment
          # visible. Exit 1 is not a render error: at least one category is
          # FAILED and the renderer has already written the real report, which
          # must be published so that failure stays visible. Replace the report
          # with a marker-first NOT RUN placeholder only when rendering failed
          # or produced no body.
          if [[ ( "$status" -ne 0 && "$status" -ne 1 ) || ! -s "$RUNNER_TEMP/comment.md" ]]; then
            head_sha="$(jq -r '.head.sha // "unknown"' "$RUNNER_TEMP/pr.json" 2>/dev/null || echo unknown)"
            cat > "$RUNNER_TEMP/comment.md" <<EOF
          <!-- qa-verification-report -->
          ## PR verification report — seven checker categories

          - Pull request: #${PR_NUMBER}
          - Current PR head: \`${head_sha}\`
          - Overall: **NOT RUN**

          The consolidated report could not be built from the supplied evidence (renderer exit ${status}).
          No checker result is claimed, and the previous report has been replaced so a stale passing result
          is not left visible. Fix the evidence or renderer error, then re-run this workflow.
          EOF
            echo "::error::The consolidated verification report could not be built (exit ${status}); a NOT RUN placeholder replaced the previous report."
          fi

      # The report is updated in place, so subsequent runs never create a second
      # report. A comment failure must not hide the rendered report from the job
      # summary or change the gate below.
      - name: Publish or update the consolidated report
        if: always() && steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          bash .github/scripts/upsert_pr_comment.sh '<!-- qa-verification-report -->' \
            "$RUNNER_TEMP/comment.md"

      - name: Enforce the report status
        if: always() && steps.pr.outputs.number != '' && steps.render.outputs.status != '0'
        env:
          RENDER_STATUS: ${{ steps.render.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RENDER_STATUS" == "2" ]]; then
            echo "::error::The consolidated verification report could not be built from the supplied evidence (renderer exit 2). The NOT RUN placeholder was published."
          elif [[ "$RENDER_STATUS" == "1" ]]; then
            echo "::error::At least one of the seven checker categories is FAILED. See the consolidated PR verification report and the job summary."
          else
            echo "::error::The consolidated verification report failed with unexpected status '${RENDER_STATUS:-unknown}'. See the job log."
          fi
          exit 1
