name: Verification Integrity

# GitHub skips `push` and `pull_request` workflows when the pull request's HEAD
# commit carries a CI-skip directive such as [skip ci]. Checks from the previous
# commit then stay visible and can look like the current head passed.
#
# `pull_request_target` is documented as NOT skipped by those directives, so this
# audit always runs. It reads the current head, matches check runs to that exact
# SHA, and reports skipped or unrun checks as NOT RUN rather than a pass.
#
# Read-only: the pull request's code is never checked out or executed.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: verification-integrity-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  audit:
    name: Verification Integrity
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/approve-'))
    runs-on: ubuntu-latest
    # A Playwright shard has its own 25-minute timeout, plus the change
    # classifier that gates it. The audit's wait must outlast that hard bound
    # rather than expiring first and reporting still-running browser work as
    # NOT RUN; this timeout leaves room for the wait, checkout and the audit.
    timeout-minutes: 40
    steps:
      - name: Checkout base repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Applicability is recomputed from the trusted base-branch classifier and
      # the pull request's actual file list, never from code in the pull request
      # head. A pull request therefore cannot relax the gate that audits it.
      - name: Compute change applicability from the trusted base
        id: applicability
        # While the trusted base does not yet contain the classifier, this step
        # must not stop the audit: empty outputs fall back to "unknown", which
        # keeps the build required and visual QA conditional.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            | jq 'add // []' > "$RUNNER_TEMP/files.json"
          bash .github/scripts/compute-applicability.sh \
            "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/files.json" >> "$GITHUB_OUTPUT"

      - name: Audit current-head verification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          SUMMARY_FILE: ${{ runner.temp }}/verification-integrity.md
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 .github/scripts/verify_pr_verification_status.py \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --wait-seconds 1800 \
            --build-required "${{ steps.applicability.outputs.build_required || 'unknown' }}" \
            --visual-required "${{ steps.applicability.outputs.visual_required || 'unknown' }}" \
            --summary "$SUMMARY_FILE"
          status=$?
          set -e
          if [[ -f "$SUMMARY_FILE" ]]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Current-head verification is not complete. Skipped or unrun checks are reported as NOT RUN and are not evidence that this pull request passed."
            exit "$status"
          fi
