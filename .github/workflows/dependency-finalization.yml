name: Temporary Dependency Finalization

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    name: Regenerate and verify dependency refresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.3

      - name: Regenerate lockfile with pnpm 10.30.3
        run: pnpm install

      - name: Verify pnpm-generated lockfile is canonical
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "PNPM_LOCKFILE_CANONICAL: pnpm install produced no lockfile diff."
          else
            echo "PNPM_LOCKFILE_CHANGED: pnpm install produced a lockfile update."
            git diff -- pnpm-lock.yaml
          fi

      - name: Run tests
        run: pnpm test

      - name: Clear build caches
        run: rm -rf .next/cache .open-next

      - name: Build Next.js app
        run: pnpm run build

      - name: Build OpenNext for Cloudflare
        run: pnpm exec opennextjs-cloudflare build

      - name: Measure build outputs against 495 MB hard limit
        run: |
          set -euo pipefail
          limit_mb=495

          next_mb=$(du -sm .next | cut -f1)
          open_next_mb=$(du -sm .open-next | cut -f1)

          next_bytes=$(du -sb .next | cut -f1)
          open_next_bytes=$(du -sb .open-next | cut -f1)

          {
            echo "495 MB hard limit"
            echo "Next.js .next: ${next_mb} MiB (${next_bytes} bytes)"
            echo "OpenNext .open-next: ${open_next_mb} MiB (${open_next_bytes} bytes)"
            echo "Next.js margin to 495 MB: $((limit_mb - next_mb)) MiB"
            echo "OpenNext margin to 495 MB: $((limit_mb - open_next_mb)) MiB"
          } | tee build-size-report.txt

          if [ "${next_mb}" -ge "${limit_mb}" ]; then
            echo "NEXT_BUILD_LIMIT_EXCEEDED"
            exit 1
          fi

          if [ "${open_next_mb}" -ge "${limit_mb}" ]; then
            echo "OPENNEXT_BUILD_LIMIT_EXCEEDED"
            exit 1
          fi

      - name: Wrangler build validation
        run: pnpm exec wrangler build --config ./wrangler.jsonc

      - name: Verify final diff scope
        run: |
          git status --short
          git diff --check

      - name: Upload regenerated lockfile and verification report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-finalization-output
          path: |
            pnpm-lock.yaml
            build-size-report.txt
