name: Deploy Updater Scheduler

on:
  pull_request:
    paths:
      - 'workers/updater-scheduler/**'
      - 'scripts/update-spec-kit-safely.sh'
      - 'scripts/rebase-speckit-customizations.sh'
      - 'scripts/test-rebase-speckit-customizations.sh'
      - '.github/spec-kit/customizations/**'
      - '.specify/features/039-speckit-updater-customizations/**'
      - '.github/workflows/deploy-updater-scheduler.yml'
      - '.github/workflows/update-spec-kit.yml'
      - '.github/workflows/refresh-docs.yml'
      - '.github/workflows/verify-updater-dispatch-token.yml'
      - '.specify/features/035-updater-scheduler-reliability/**'
      - '.specify/features/036-updater-scheduler-cutover/**'
      - '.specify/feature.json'
      - 'memory-bank/activeContext.md'
      - 'memory-bank/progress.md'
      - 'PR_SUMMARY.md'
  push:
    branches: [main]
    paths:
      - 'workers/updater-scheduler/**'
      - '.github/workflows/deploy-updater-scheduler.yml'
      - '.github/workflows/verify-updater-dispatch-token.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-updater-scheduler-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify updater scheduler
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.0.0
        with:
          version: 10.30.3

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Test approved schedule mapping and safe dispatch behaviour
        run: node --test workers/updater-scheduler/test/index.node-test.mjs

      - name: Test Spec Kit customization rebase
        run: bash scripts/test-rebase-speckit-customizations.sh

      - name: Install uv for Spec Kit smoke test
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Exercise the real safe Spec Kit upgrade in this isolated PR checkout
        run: bash scripts/update-spec-kit-safely.sh

      - name: Run repository governance verification
        run: ./jules-verify.sh

      - name: Enforce 495 MiB build-size ceiling
        shell: bash
        run: |
          set -euo pipefail
          size_bytes="$(du -sb .next public | awk '{total += $1} END {printf "%.0f", total}')"
          max_bytes="$((495 * 1024 * 1024))"
          size_mib="$(awk -v bytes="$size_bytes" 'BEGIN {printf "%.2f", bytes / 1024 / 1024}')"
          printf 'Combined .next + public: %s bytes (%s MiB)\n' "$size_bytes" "$size_mib"
          printf 'Hard maximum: %s bytes (495 MiB)\n' "$max_bytes"
          if (( size_bytes >= max_bytes )); then
            echo "::error::Combined .next + public build size reached or exceeded 495 MiB; stopping before further verification."
            exit 1
          fi

      - name: Wrangler dry-run (no deploy)
        run: pnpm exec wrangler deploy --dry-run --config workers/updater-scheduler/wrangler.toml

  deploy:
    name: Deploy updater scheduler
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.0.0
        with:
          version: 10.30.3

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Test approved schedule mapping and safe dispatch behaviour
        run: node --test workers/updater-scheduler/test/index.node-test.mjs

      - name: Validate GitHub dispatch write permission before enabling scheduler
        env:
          UPDATER_DISPATCH_TOKEN: ${{ secrets.UPDATER_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq '^DISPATCH_ENABLED = "true"$' workers/updater-scheduler/wrangler.toml; then
            echo "::notice::Dispatch remains disabled; skipping token dispatch preflight."
            exit 0
          fi

          if [[ -z "${UPDATER_DISPATCH_TOKEN:-}" ]]; then
            echo "::error::DISPATCH_ENABLED is true but repository secret UPDATER_DISPATCH_TOKEN is missing. Worker deployment was blocked."
            exit 1
          fi

          # Dispatch a unique no-op canary, then verify that exact run succeeds.
          # Never dispatch either production updater as a credential test.
          export GH_TOKEN="$UPDATER_DISPATCH_TOKEN"
          PROBE_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/verify-updater-dispatch-token.yml/dispatches" \
            -f ref=main -f "inputs[probe_id]=${PROBE_ID}" >/dev/null

          EXPECTED_TITLE="Updater dispatch token canary — ${PROBE_ID}"
          CANARY_RUN_ID=""
          for attempt in $(seq 1 40); do
            RUNS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verify-updater-dispatch-token.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            CANARY_RUN_ID="$(printf '%s' "$RUNS_JSON" | jq -r --arg expected "$EXPECTED_TITLE" '[.workflow_runs[] | select(.display_title == $expected) | .id][0] // empty')"
            if [[ -n "$CANARY_RUN_ID" ]]; then
              break
            fi
            sleep 3
          done

          if [[ -z "$CANARY_RUN_ID" ]]; then
            echo "::error::GitHub accepted the dispatch but the matching canary run did not appear within 120 seconds."
            exit 1
          fi

          for attempt in $(seq 1 60); do
            RUN_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANARY_RUN_ID}" --jq '[.status, (.conclusion // "")] | join("|")')"
            RUN_STATUS="${RUN_STATE%%|*}"
            RUN_CONCLUSION="${RUN_STATE#*|}"
            if [[ "$RUN_STATUS" == "completed" ]]; then
              if [[ "$RUN_CONCLUSION" == "success" ]]; then
                echo "::notice::Canary run ${CANARY_RUN_ID} completed successfully. Production updater dispatch was not tested."
                exit 0
              fi
              echo "::error::Canary run ${CANARY_RUN_ID} completed with conclusion '${RUN_CONCLUSION}'. Worker deployment was blocked."
              exit 1
            fi
            sleep 3
          done

          echo "::error::Canary run ${CANARY_RUN_ID} did not complete successfully within 180 seconds. Worker deployment was blocked."
          exit 1

      - name: Deploy updater scheduler from reviewed configuration
        env:
          UPDATER_DISPATCH_TOKEN: ${{ secrets.UPDATER_DISPATCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^DISPATCH_ENABLED = "true"$' workers/updater-scheduler/wrangler.toml; then
            if [[ -z "${UPDATER_DISPATCH_TOKEN:-}" ]]; then
              echo "::error::DISPATCH_ENABLED is true but repository secret UPDATER_DISPATCH_TOKEN is missing. Worker deployment was blocked."
              exit 1
            fi

            # Deploy code and secret together. A separate secret-only update can
            # fail when the latest Worker version is not currently deployed.
            SECRETS_FILE="${RUNNER_TEMP}/updater-scheduler-secrets.json"
            trap 'rm -f "$SECRETS_FILE"' EXIT
            umask 077
            node -e 'const fs = require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({ GITHUB_TOKEN: process.env.UPDATER_DISPATCH_TOKEN }), { mode: 0o600 });' "$SECRETS_FILE"
            pnpm exec wrangler deploy --config workers/updater-scheduler/wrangler.toml --secrets-file "$SECRETS_FILE"
          else
            echo "::notice::Dispatch remains disabled; deploying the reviewed disabled configuration without a dispatch secret."
            pnpm exec wrangler deploy --config workers/updater-scheduler/wrangler.toml
          fi
