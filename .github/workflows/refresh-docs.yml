name: Refresh Documentation

run-name: Refresh Documentation — ${{ github.event.inputs.dispatch_source || github.event_name }}

on:
  # Native schedules remain guarded until the Cloudflare Worker handoff is verified.
  schedule:
    - cron: '21 2 * * 2,5'
      timezone: 'America/Halifax'
    - cron: '21 6 * * 2,5'
      timezone: 'America/Halifax'
    - cron: '21 10 * * 2,5'
      timezone: 'America/Halifax'
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: "Trigger source: manual owner request or Cloudflare scheduler."
        type: choice
        required: true
        default: manual
        options:
          - manual
          - cloudflare
      scheduler_slot:
        description: "Cloudflare scheduler slot; blank for a manual run."
        type: string
        required: false
        default: ""

concurrency:
  group: refresh-documentation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    if: github.event_name != 'schedule' || vars.UPDATER_SCHEDULER_ACTIVE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Record Trigger Timing
        env:
          DISPATCH_SOURCE: ${{ github.event.inputs.dispatch_source || github.event_name }}
          SCHEDULER_SLOT: ${{ github.event.inputs.scheduler_slot || 'scheduled' }}
        run: |
          echo "Trigger kind: $GITHUB_EVENT_NAME"
          echo "Dispatch source: $DISPATCH_SOURCE"
          echo "Scheduler slot: $SCHEDULER_SLOT"
          echo "Runner UTC: $(date -u --iso-8601=seconds)"
          echo "Atlantic time: $(TZ=America/Halifax date --iso-8601=seconds)"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install -g pnpm@10.30.3
          pnpm install --frozen-lockfile

      - name: Run Documentation Refresh
        run: node scripts/refresh-docs.js

      - name: Check for Changes
        id: changes
        run: |
          git add .docs/
          if git diff --staged --quiet; then
            echo "No changes detected in documentation."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in documentation."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Refresh Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_SOURCE: ${{ github.event.inputs.dispatch_source || github.event_name }}
          SCHEDULER_SLOT: ${{ github.event.inputs.scheduler_slot || 'scheduled' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .docs/
          if ! git commit -m "docs: update upstream documentation snapshots"; then
            echo "No staged documentation changes remain."
            exit 0
          fi
          git push --force origin HEAD:refs/heads/auto/docs-refresh
          PR_EXISTS="$(gh pr list --state open --head auto/docs-refresh --json number -q '.[0].number' || true)"
          COMMIT_SHA="$(git rev-parse HEAD)"
          if [[ -z "$PR_EXISTS" || "$PR_EXISTS" == "null" ]]; then
            NEW_PR_URL="$(gh pr create --title "docs: scheduled documentation refresh" --body 'Automated documentation refresh from the configured upstream documentation sources. This PR updates the local .docs snapshots for the approved library inventory.' --base main --head auto/docs-refresh --reviewer davidcollier77-code || gh pr create --title "docs: scheduled documentation refresh" --body 'Automated documentation refresh from the configured upstream documentation sources. This PR updates the local .docs snapshots for the approved library inventory.' --base main --head auto/docs-refresh)"
            PR_NUMBER="${NEW_PR_URL##*/}"
            PR_OPERATION="created"
          else
            PR_NUMBER="$PR_EXISTS"
            PR_OPERATION="updated"
          fi
          MARKER="<!-- notify-update:$COMMIT_SHA -->"
          COMMENTS="$(gh pr view "$PR_NUMBER" --json comments -q '.comments[].body' 2>/dev/null || true)"
          if ! printf '%s\n' "$COMMENTS" | grep -Fq "$MARKER"; then
            gh pr comment "$PR_NUMBER" --body "@davidcollier77-code The Documentation Library updater completed and $PR_OPERATION this PR. Trigger: $DISPATCH_SOURCE ($SCHEDULER_SLOT). Please review the refreshed documentation. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} $MARKER"
          else
            echo "Notification for commit $COMMIT_SHA was already posted."
          fi
