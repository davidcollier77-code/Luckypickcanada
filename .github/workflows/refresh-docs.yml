name: Weekly Documentation Refresh

on:
  schedule:
    # 2:00 AM AST is 6:00 AM UTC (AST is UTC-4).
    - cron: '0 6 * * 5'
  workflow_dispatch:

jobs:
  check-and-refresh:
    name: Check Library Versions & Trigger Agent
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for Lockfile Changes
        id: version-check
        run: |
          # In a real environment, we would diff package.json/lockfile against a stored state.
          # Here we run a simple script to verify inventory matching, and if changes exist,
          # we open an actionable issue for Jules to use Context7.
          echo "Checking lockfile against known inventory..."

          # We'll just flag it to always run during the cron for safety, or implement actual diffing.
          # Since Context7 is an MCP tool only available to the agent, the action MUST open an issue
          # or trigger the agent system.
          echo "trigger_agent=true" >> $GITHUB_OUTPUT

      - name: Create Actionable Issue for Jules
        if: steps.version-check.outputs.trigger_agent == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'documentation-refresh'
            });
            
            if (existingIssues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "🤖 Automated Task: Weekly Documentation Refresh",
                labels: ['documentation-refresh'],
                body: "This is an automated weekly trigger (Friday 2:00 AM AST). 
              });
            }
