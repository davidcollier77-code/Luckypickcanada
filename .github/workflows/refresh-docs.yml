name: Refresh Documentation

run-name: Refresh Documentation — ${{ github.event.schedule || 'manual' }}

on:
  schedule:
    # Primary refresh: 2:21 AM Atlantic local time every Tuesday and Friday.
    # GitHub handles America/Halifax daylight saving time automatically.
    - cron: '21 2 * * 2,5'
      timezone: 'America/Halifax'

    # Backup refresh: 6:21 AM Atlantic local time every Tuesday and Friday.
    # Provides a second independent opportunity if the 2:21 AM scheduled run
    # was delayed, missed, or otherwise did not complete.
    - cron: '21 6 * * 2,5'
      timezone: 'America/Halifax'

    # Recovery refresh: 10:21 AM Atlantic local time every Tuesday and Friday.
    # Gives the schedule path another opportunity when GitHub delivers earlier
    # scheduled events late or drops a queued event during heavy Actions load.
    - cron: '21 10 * * 2,5'
      timezone: 'America/Halifax'

  # Manual escape hatch for an immediate refresh.
  workflow_dispatch:

concurrency:
  group: refresh-documentation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Record Trigger Timing
        env:
          SCHEDULE_CRON: ${{ github.event.schedule || 'manual' }}
        run: |
          echo "Trigger schedule: $SCHEDULE_CRON"
          echo "Runner UTC: $(date -u --iso-8601=seconds)"
          echo "Atlantic time: $(TZ=America/Halifax date --iso-8601=seconds)"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install -g pnpm@10.30.3
          pnpm install --frozen-lockfile

      - name: Run Documentation Refresh
        run: |
          node scripts/refresh-docs.js

      - name: Check for Changes
        id: changes
        run: |
          git add .docs/
          if git diff --staged --quiet; then
            echo "No changes detected in documentation."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in documentation."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git identity for the automated commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all modified documentation files produced by the updater
          git add .docs/

          # Commit the changes. If there's nothing to commit despite the earlier check, skip push.
          if git commit -m "docs: update upstream documentation snapshots"; then
            # Force push the absolute desired state to the PR branch.
            # This explicitly overwrites any stale previous run and perfectly mirrors main + docs,
            # bypassing the rebase/stash-pop timestamp merge conflict that previously stalled the PR lifecycle.
            git push --force origin HEAD:refs/heads/auto/docs-refresh

            # Verify if the PR already exists
            PR_EXISTS=$(gh pr list --state open --head auto/docs-refresh --json number -q '.[0].number' || echo "")

            # Get the commit SHA to uniquely identify this update
            COMMIT_SHA=$(git rev-parse HEAD)

            if [ -z "$PR_EXISTS" ] || [ "$PR_EXISTS" = "null" ]; then
              # Create the PR if it does not exist
              # We attempt to add reviewer using gh pr create natively
              NEW_PR_URL=$(gh pr create --title "docs: scheduled documentation refresh" --body 'Automated documentation refresh from the configured upstream documentation sources.%0A%0AThis PR updates the local `.docs/` snapshots to reflect the latest upstream documentation for the approved library inventory.' --base main --head auto/docs-refresh --reviewer davidcollier77-code || \
                          gh pr create --title "docs: scheduled documentation refresh" --body 'Automated documentation refresh from the configured upstream documentation sources.%0A%0AThis PR updates the local `.docs/` snapshots to reflect the latest upstream documentation for the approved library inventory.' --base main --head auto/docs-refresh)

              echo "Created new PR: $NEW_PR_URL"

              # Determine the newly created PR number from the URL
              # (gh pr create returns the URL, e.g., https://github.com/org/repo/pull/123)
              NEW_PR_NUM=$(echo "$NEW_PR_URL" | awk -F/ '{print $NF}')

              # Check if a review request was successfully made
              HAS_REVIEWER=$(gh pr view $NEW_PR_NUM --json reviewRequests -q ".reviewRequests | length" || echo "0")

              if [ "$HAS_REVIEWER" = "0" ]; then
                # Fallback to comment mention if reviewer assignment wasn't possible
                gh pr comment $NEW_PR_NUM --body "@davidcollier77-code A new Documentation Library update PR has been created and is ready for review."
              fi
            else
              echo "PR #$PR_EXISTS already exists and has been successfully updated via force-push."

              # Ensure the repo owner is notified about the new update to an existing PR
              MARKER="<!-- notify-update:$COMMIT_SHA -->"

              # Check if we already commented for this specific commit
              COMMENT_EXISTS=$(gh pr view $PR_EXISTS --json comments -q ".comments[].body" | grep -F "$MARKER" || echo "")

              if [ -z "$COMMENT_EXISTS" ]; then
                gh pr comment $PR_EXISTS --body "@davidcollier77-code The Documentation Library update PR has been refreshed with new changes and is ready for review. $MARKER"
              else
                echo "Notification for commit $COMMIT_SHA was already posted."
              fi
            fi
          fi
