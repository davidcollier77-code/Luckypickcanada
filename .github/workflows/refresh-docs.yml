name: Refresh Documentation

on:
  schedule:
    # Primary refresh: 2:21 AM Atlantic local time every Tuesday and Friday.
    # GitHub handles America/Halifax daylight saving time automatically.
    - cron: '21 2 * * 2,5'
      timezone: 'America/Halifax'

    # Backup refresh: 6:21 AM Atlantic local time every Tuesday and Friday.
    # Provides a second independent opportunity if the 2:21 AM scheduled run
    # was delayed, missed, or otherwise did not complete.
    - cron: '21 6 * * 2,5'
      timezone: 'America/Halifax'

  # Manual escape hatch for an immediate refresh.
  workflow_dispatch:

permissions:
concurrency:
  group: refresh-documentation
  queue: max
  cancel-in-progress: false

  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install -g pnpm@10.30.3
          pnpm install --frozen-lockfile

      - name: Run Documentation Refresh
        run: |
          node scripts/refresh-docs.js

      - name: Check for Changes
        id: changes
        run: |
          git add .docs/
          if git diff --staged --quiet; then
            echo "No changes detected in documentation."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in documentation."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update upstream documentation snapshots"
          title: "docs: scheduled documentation refresh"
          body: |
            Automated documentation refresh from the configured upstream documentation sources.

            This PR updates the local `.docs/` snapshots to reflect the latest upstream documentation for the approved library inventory.
          branch: auto/docs-refresh
          delete-branch: true
          base: main
