name: Visual QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: visual-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Visual QA is only meaningful when a pull request can change rendered output.
  # This job classifies the changed paths and fails closed: a failed file listing,
  # an empty list, or any path that is not documentation-only requires visual QA.
  changes:
    name: Detect visual changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      visual_required: ${{ steps.classify.outputs.visual_required }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Classify pull request change set
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          files="$(mktemp)"
          trap 'rm -f "$files"' EXIT

          if ! gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' >"$files"; then
            echo "::warning::The pull request file list could not be read; requesting visual QA (fail closed)."
            echo "visual_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! classification="$(bash .github/scripts/classify-visual-changes.sh <"$files")"; then
            echo "::warning::Change classification failed; requesting visual QA (fail closed)."
            classification="visual_required=true"
          fi

          case "$classification" in
            visual_required=true | visual_required=false) ;;
            *)
              echo "::warning::Change classification returned an unexpected value; requesting visual QA (fail closed)."
              classification="visual_required=true"
              ;;
          esac

          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$classification" >> "$GITHUB_STEP_SUMMARY"

  visual:
    name: Visual QA
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The Spec Kit task verifier compares active feature artifacts to the base ref.
          fetch-depth: 0
          persist-credentials: false

      # setup-node's pnpm cache requires pnpm to be available on PATH first.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run targeted Crystal Ball allowance and Oracle validation unit tests
        run: pnpm exec vitest run __tests__/crystal-ball-daily-usage.test.js __tests__/oracle-route-validation.test.js

      - name: Run all unit tests
        run: pnpm run test

      - name: Run standalone TypeScript check
        run: pnpm tsc --noEmit

      - name: Run AGENTS.md Spec Kit verification
        env:
          # GitHub-reported pull request author. This is the only trusted input for
          # the narrow Dependabot maintenance exemption; it is never derived from
          # the pull request title or branch name.
          SPEC_KIT_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: ./freebuff-verify.sh

      # The Chromium build Playwright downloads is a function of the Playwright
      # version, so the cache key is the runner OS plus that exact version. A
      # version change misses the cache and downloads a matching browser instead
      # of reusing a stale one. Only Chromium is installed; the three Playwright
      # projects in playwright.config.ts all use Chromium.
      - name: Resolve installed Playwright version
        id: playwright-version
        if: needs.changes.outputs.visual_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve the installed Playwright version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $version"

      - name: Restore cached Playwright Chromium
        id: playwright-cache
        if: needs.changes.outputs.visual_required == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (cache miss)
        if: needs.changes.outputs.visual_required == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cache hit)
        if: needs.changes.outputs.visual_required == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Temporary, narrowly gated snapshot refresh for PR #1783 only.
      # The Playwright process receives no write token; a later trusted step
      # commits exactly the three approved PNG paths.
      - name: Generate approved homepage viewport baselines for PR #1783
        id: generate-homepage-baselines
        if: needs.changes.outputs.visual_required == 'true' && github.event.pull_request.number == 1783 && github.head_ref == 'freebuff/40867abcd68f1e53d3356b9f'
        run: pnpm exec playwright test tests/visual/homepage.spec.ts --grep "homepage viewport matches the approved visual baseline" --update-snapshots

      - name: Commit the three homepage viewport baselines for PR #1783
        id: commit-homepage-baselines
        if: steps.generate-homepage-baselines.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" == "1783" ]]
          [[ "$GITHUB_HEAD_REF" == "freebuff/40867abcd68f1e53d3356b9f" ]]
          [[ "$GITHUB_REPOSITORY" == "davidcollier77-code/Luckypickcanada" ]]

          git add -- \
            tests/visual/__screenshots__/desktop/homepage-viewport.png \
            tests/visual/__screenshots__/mobile-390/homepage-viewport.png \
            tests/visual/__screenshots__/mobile-412/homepage-viewport.png

          changed_files="$(git diff --cached --name-only | sort)"
          expected_files="$(printf '%s\n' \
            tests/visual/__screenshots__/desktop/homepage-viewport.png \
            tests/visual/__screenshots__/mobile-390/homepage-viewport.png \
            tests/visual/__screenshots__/mobile-412/homepage-viewport.png | sort)"

          if [[ "$changed_files" != "$expected_files" ]]; then
            echo "::error::Snapshot refresh did not produce exactly the three approved PNG baselines."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_files" "$changed_files"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): refresh approved homepage viewport baselines"

          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:$GITHUB_HEAD_REF"
          unset GH_TOKEN auth_header
          echo "refreshed=true" >> "$GITHUB_OUTPUT"

      - name: Verify committed visual baselines
        if: needs.changes.outputs.visual_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          snapshot_count=0
          if [[ -d tests/visual/__screenshots__ ]]; then
            snapshot_count="$(find tests/visual/__screenshots__ -type f -name '*.png' | wc -l | tr -d ' ')"
          fi
          if [[ "$snapshot_count" -lt 3 ]]; then
            echo "::error::Expected at least 3 committed homepage visual baselines; found $snapshot_count."
            exit 1
          fi
          echo "Committed visual baselines: $snapshot_count PNG files."

      - name: Run visual regression tests
        if: needs.changes.outputs.visual_required == 'true' && steps.commit-homepage-baselines.outputs.refreshed != 'true'
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
