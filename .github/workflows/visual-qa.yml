name: Visual QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: visual-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Visual QA is only meaningful when a pull request can change rendered output.
  # This job classifies the changed paths and fails closed: a failed file listing,
  # an empty list, an unreadable package.json comparison, or any path that is not
  # positively established as non-rendering requires visual QA.
  changes:
    name: Detect visual changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      visual_required: ${{ steps.classify.outputs.visual_required }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read declared visual impact
        id: declared-impact
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          required=false
          if [[ -n "${PR_BODY:-}" ]]; then
            if ! parse_out="$(python3 - <<'PYEOF'
          import json, os, re, sys
          body = os.environ.get("PR_BODY", "")
          m = re.search(r"<!-- qa-scope:start -->(.*?)<!-- qa-scope:end -->", body, re.S)
          if not m:
              print("false")
              sys.exit(0)
          try:
              d = json.loads(m.group(1))
          except json.JSONDecodeError as exc:
              print(
                  f"::warning::visual-qa: QA scope JSON is malformed ({exc}); "
                  "defaulting visual_impact.required=true (fail-closed).",
                  file=sys.stderr,
              )
              print("true")
              sys.exit(0)
          if not isinstance(d, dict):
              print(
                  "::warning::visual-qa: QA scope block is not a JSON object; "
                  "defaulting visual_impact.required=true (fail-closed).",
                  file=sys.stderr,
              )
              print("true")
              sys.exit(0)
          i = d.get("visual_impact")
          print("true" if isinstance(i, dict) and i.get("required") is True else "false")
          PYEOF
          )"; then
              echo "::warning::visual-qa: Python parse step failed unexpectedly; defaulting visual_impact.required=true (fail-closed)."
              parse_out="true"
            fi
            required="$parse_out"
          fi
          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"

      - name: Classify pull request change set
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          files="$(mktemp)"
          trap 'rm -f "$files"' EXIT

          if ! gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' >"$files"; then
            echo "::warning::The pull request file list could not be read; requesting visual QA (fail closed)."
            echo "visual_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # package.json is never exempt by path. Compare the base and head
          # manifests so only a change limited to test/tooling scripts can skip
          # visual QA. Dependencies, exports, engines, pnpm overrides, build/dev
          # lifecycle scripts and any failed comparison keep visual QA.
          package_json_scripts_only=false
          if grep -Fxq 'package.json' "$files"; then
            base_package="$(mktemp)"
            head_package="$(mktemp)"
            trap 'rm -f "$files" "$base_package" "$head_package"' EXIT
            if gh api -H 'Accept: application/vnd.github.raw' \
                 "repos/${REPOSITORY}/contents/package.json?ref=${BASE_SHA}" >"$base_package" \
               && gh api -H 'Accept: application/vnd.github.raw' \
                 "repos/${REPOSITORY}/contents/package.json?ref=${HEAD_SHA}" >"$head_package" \
               && package_json_decision="$(node .github/scripts/package-json-scripts-only.mjs "$base_package" "$head_package")"; then
              case "$package_json_decision" in
                scripts_only=true) package_json_scripts_only=true ;;
                scripts_only=false) ;;
                *)
                  echo "::warning::package.json classification returned an unexpected value; treating the manifest as rendering-affecting (fail closed)."
                  ;;
              esac
            else
              echo "::warning::package.json could not be compared with its base revision; treating the manifest as rendering-affecting (fail closed)."
            fi
          fi

          if ! classification="$(PACKAGE_JSON_SCRIPTS_ONLY="$package_json_scripts_only" \
            bash .github/scripts/classify-visual-changes.sh <"$files")"; then
            echo "::warning::Change classification failed; requesting visual QA (fail closed)."
            classification="visual_required=true"
          fi

          case "$classification" in
            visual_required=true | visual_required=false) ;;
            *)
              echo "::warning::Change classification returned an unexpected value; requesting visual QA (fail closed)."
              classification="visual_required=true"
              ;;
          esac

          if [[ "${{ steps.declared-impact.outputs.required }}" == "true" ]]; then
            echo "::notice::The PR declares visual impact; visual QA is required."
            classification="visual_required=true"
          fi

          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$classification" >> "$GITHUB_STEP_SUMMARY"

  # Application verification that every pull request needs, independent of
  # whether a browser is involved. This keeps one stable "Visual QA" check for
  # documentation-only pull requests and for the verification-integrity audit.
  verify:
    name: Visual QA
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The Spec Kit task verifier compares active feature artifacts to the base ref.
          fetch-depth: 0

      # setup-node's pnpm cache requires pnpm to be available on PATH first.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3

      - name: Use Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          # playwright-chromium's postinstall would download a browser during
          # installation. The verification job never launches a browser, and the
          # visual job provisions Chromium explicitly after its version-keyed
          # cache step, so that download is always redundant in QA.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      # Exercise the QA infrastructure checkers directly. These tests do not
      # replace or narrow the application suite below.
      - name: Test QA infrastructure checkers
        run: |
          python3 -m py_compile \
            .github/scripts/check_qa_pr_scope.py \
            .github/scripts/checker_suite.py \
            .github/scripts/pr_verification_report.py \
            .github/scripts/report_visual_qa_install_timings.py \
            .github/scripts/review_pr_changes.py \
            .github/scripts/summarize_devskim_findings.py \
            .github/scripts/verify_pr_verification_status.py
          PYTHONPATH=.github/scripts python3 -m unittest \
            test_check_qa_pr_scope \
            test_checker_suite \
            test_pr_verification_report \
            test_report_visual_qa_install_timings \
            test_review_pr_changes \
            test_summarize_devskim_findings \
            test_verify_pr_verification_status \
            -v

      # The full suite includes the Crystal Ball allowance and Oracle validation
      # files that used to run here again as a separate targeted step.
      - name: Run all unit tests
        run: pnpm run test

      # Keep the application type check in QA without making QA depend on
      # Freebuff's own Agent MD verification script. Build validation runs in
      # the dedicated OpenNext workflow.
      - name: Run standalone TypeScript check
        run: pnpm exec tsc --noEmit

  # Browser verification runs in two Playwright-native shards. Sharding splits
  # spec files across runners, so every test still runs and every committed
  # baseline is still compared. Both shards must pass; the verification-integrity
  # audit treats any failed shard as a failed Visual QA group.
  visual:
    name: Visual QA (shard ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.visual_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # setup-node's pnpm cache requires pnpm to be available on PATH first.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3

      - name: Use Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          # Skip playwright-chromium's postinstall download. It runs before the
          # version-keyed browser cache is restored and would duplicate the
          # Chromium build this job installs explicitly after that cache step.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      # The Chromium build Playwright downloads is a function of the Playwright
      # version, so the cache key is the runner OS plus that exact version. A
      # version change misses the cache and downloads a matching browser instead
      # of reusing a stale one. Only Chromium is installed; the three Playwright
      # projects in playwright.config.ts all use Chromium.
      - name: Resolve installed Playwright version
        id: playwright-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve the installed Playwright version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $version"

      - name: Restore cached Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # A version-keyed cache normally restores a matching browser, but a partial
      # or corrupt archive restores "successfully" with nothing runnable inside.
      # Verify the archive before skipping the download so that case reinstalls
      # instead of failing every test at launch.
      - name: Validate restored Playwright Chromium
        id: playwright-browser
        shell: bash
        run: |
          set -euo pipefail
          state="$(bash .github/scripts/verify-playwright-cache.sh)"
          printf '%s\n' "$state" >> "$GITHUB_OUTPUT"
          if [[ "$state" != 'ready=true' ]]; then
            echo "::warning::The restored Playwright cache has no usable Chromium executable; installing a matching build."
          fi

      - name: Install Playwright Chromium (browser unavailable)
        if: steps.playwright-browser.outputs.ready != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies (browser cached)
        if: steps.playwright-browser.outputs.ready == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Verify committed visual baselines
        shell: bash
        run: |
          set -euo pipefail
          snapshot_count=0
          if [[ -d tests/visual/__screenshots__ ]]; then
            snapshot_count="$(find tests/visual/__screenshots__ -type f -name '*.png' | wc -l | tr -d ' ')"
          fi
          if [[ "$snapshot_count" -lt 3 ]]; then
            echo "::error::Expected at least 3 committed homepage visual baselines; found $snapshot_count."
            exit 1
          fi
          echo "Committed visual baselines: $snapshot_count PNG files."

      - name: Run visual regression tests (shard ${{ matrix.shard }} of 2)
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-visual-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
