name: Visual QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: visual-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Visual QA is only meaningful when a pull request can change rendered output.
  # This job classifies the changed paths and fails closed: a failed file listing,
  # an empty list, or any path that is not documentation-only requires visual QA.
  changes:
    name: Detect visual changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      visual_required: ${{ steps.classify.outputs.visual_required }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Classify pull request change set
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          files="$(mktemp)"
          trap 'rm -f "$files"' EXIT

          if ! gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' >"$files"; then
            echo "::warning::The pull request file list could not be read; requesting visual QA (fail closed)."
            echo "visual_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! classification="$(bash .github/scripts/classify-visual-changes.sh <"$files")"; then
            echo "::warning::Change classification failed; requesting visual QA (fail closed)."
            classification="visual_required=true"
          fi

          case "$classification" in
            visual_required=true | visual_required=false) ;;
            *)
              echo "::warning::Change classification returned an unexpected value; requesting visual QA (fail closed)."
              classification="visual_required=true"
              ;;
          esac

          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$classification" >> "$GITHUB_STEP_SUMMARY"

  # Application verification that every pull request needs, independent of
  # whether a browser is involved. This keeps one stable "Visual QA" check for
  # documentation-only pull requests and for the verification-integrity audit.
  verify:
    name: Visual QA
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The Spec Kit task verifier compares active feature artifacts to the base ref.
          fetch-depth: 0

      # setup-node's pnpm cache requires pnpm to be available on PATH first.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3

      - name: Use Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full suite includes the Crystal Ball allowance and Oracle validation
      # files that used to run here again as a separate targeted step.
      - name: Run all unit tests
        run: pnpm run test

      # freebuff-verify.sh runs the Spec Kit governance tests, the TypeScript
      # check, the production build and the refresh-docs tests. The standalone
      # tsc step that used to run here duplicated that same type check.
      - name: Run AGENTS.md Spec Kit verification
        env:
          # GitHub-reported pull request author. This is the only trusted input for
          # the narrow Dependabot maintenance exemption; it is never derived from
          # the pull request title or branch name.
          SPEC_KIT_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: ./freebuff-verify.sh

  # Browser verification runs in two Playwright-native shards. Sharding splits
  # spec files across runners, so every test still runs and every committed
  # baseline is still compared. Both shards must pass; the verification-integrity
  # audit treats any failed shard as a failed Visual QA group.
  visual:
    name: Visual QA (shard ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.visual_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # setup-node's pnpm cache requires pnpm to be available on PATH first.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3

      - name: Use Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Chromium build Playwright downloads is a function of the Playwright
      # version, so the cache key is the runner OS plus that exact version. A
      # version change misses the cache and downloads a matching browser instead
      # of reusing a stale one. Only Chromium is installed; the three Playwright
      # projects in playwright.config.ts all use Chromium.
      - name: Resolve installed Playwright version
        id: playwright-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve the installed Playwright version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $version"

      - name: Restore cached Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Verify committed visual baselines
        shell: bash
        run: |
          set -euo pipefail
          snapshot_count=0
          if [[ -d tests/visual/__screenshots__ ]]; then
            snapshot_count="$(find tests/visual/__screenshots__ -type f -name '*.png' | wc -l | tr -d ' ')"
          fi
          if [[ "$snapshot_count" -lt 3 ]]; then
            echo "::error::Expected at least 3 committed homepage visual baselines; found $snapshot_count."
            exit 1
          fi
          echo "Committed visual baselines: $snapshot_count PNG files."

      - name: Run visual regression tests (shard ${{ matrix.shard }} of 2)
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-visual-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
