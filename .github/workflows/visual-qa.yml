name: Visual QA

on:
  push:
    branches: [visual-qa/playwright-homepage]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASELINE_BOOTSTRAP_BRANCH: visual-qa/playwright-homepage
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Establish initial homepage visual baselines
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          snapshot_count=0
          if [[ -d tests/visual/__screenshots__ ]]; then
            snapshot_count="$(find tests/visual/__screenshots__ -type f -name '*.png' | wc -l | tr -d ' ')"
          fi
          if [[ "$snapshot_count" -gt 0 ]]; then
            echo "Visual baselines already exist: $snapshot_count PNG files."
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.head_ref || github.ref_name }}" != "$BASELINE_BOOTSTRAP_BRANCH" ]]; then
            echo "::error::Visual baselines are missing on a non-bootstrap branch."
            exit 1
          fi
          echo "No visual baselines exist. Generating the initial approved baseline from this setup branch."
          pnpm exec playwright test --update-snapshots
          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"

      - name: Run visual regression tests
        run: pnpm exec playwright test

      - name: Commit initial visual baselines
        if: steps.bootstrap.outputs.bootstrapped == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "test: establish homepage visual baselines"
          git push

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
