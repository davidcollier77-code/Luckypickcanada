name: Visual QA Summary

# Visual QA runs PR code, so it must not hold pull-request write access. This
# follow-up workflow runs from the default branch after Visual QA finishes and
# publishes the result as one updated comment: which shard failed, where the run
# is, and that a skipped shard is NOT RUN rather than a pass.
on:
  workflow_run:
    workflows: ["Visual QA"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: read

concurrency:
  group: visual-qa-summary-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  summary:
    name: Visual QA summary
    if: github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout trusted checker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Fetch check runs for the head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
            > "$RUNNER_TEMP/checks.json"

      - name: Render the summary
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 .github/scripts/checker_suite.py \
            browser-summary --checks "$RUNNER_TEMP/checks.json" \
            --comment "$RUNNER_TEMP/comment.md"

      - name: Publish or update the summary
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/upsert_pr_comment.sh '<!-- qa-browser-summary -->' \
            "$RUNNER_TEMP/comment.md"
