name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    # GitHub withholds repository secrets from Dependabot PR runs. Skip this credentialed
    # review job for bot-authored PRs instead of failing the entire required check.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    name: Run PR Agent
    steps:
      - name: Verify Gemini credential is configured
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::Repository Actions secret GEMINI_API_KEY is missing or unavailable to this run."
            exit 1
          fi
          echo "Gemini credential is configured; its value will not be printed."

      - name: Review pull request with Gemini
        id: pragent
        uses: the-pr-agent/pr-agent@a5d2260d810837d0878eb52aa9680ff936ae1150
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.6-flash", "gemini/gemini-3.5-flash-lite"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'
          pr_reviewer.num_max_findings: "8"
          pr_reviewer.inline_key_issues: "true"
          pr_reviewer.require_tests_review: "true"
          pr_reviewer.require_security_review: "true"
          pr_reviewer.require_risk_assessment: "true"
          pr_reviewer.require_merge_recommendation: "true"
          pr_reviewer.require_failure_modes: "true"
          pr_reviewer.extra_instructions: >-
            Review the entire PR diff and the directly relevant surrounding code, callers, configuration, and tests. Focus on issues introduced by this change, not unrelated pre-existing cleanup.
            
            Prioritize relevant checks across:
            - Correctness and bugs: realistic edge cases, race conditions, state transitions, error handling, broken callers, data loss, and production regressions.
            - Security and integrity: authorization, validation, secret exposure, unsafe input, and sensitive data handling.
            - Performance: extra work or renders, blocking work, bundle and asset size, image delivery, and Core Web Vitals risks.
            - SEO: metadata, canonical/indexability directives, structured data, semantic links, and rendering/indexability issues.
            - Visual/UI behavior: responsive layout, overflow, spacing, typography, contrast, asset rendering, and interactions.
            - Accessibility: semantic markup, keyboard behavior, focus, reduced motion, and accessible names.
            - Tests: missing regression coverage and realistic cases that could fail in production despite passing tests.
            
            For every material finding, provide severity (BLOCKER, HIGH, MEDIUM, or LOW), the exact changed file and line, a realistic trigger scenario, the concrete impact, supporting code evidence, and the smallest practical fix. Prefer precise, line-anchored inline findings. Distinguish confirmed defects from risks that still need verification.
            
            Do not report unrelated style preferences, duplicate existing findings, vague hypotheticals, or problems unsupported by code evidence. Do not invent findings to fill the configured limit. Examine SEO, visual, and accessibility concerns only when relevant to the changed files. Never claim actual visual QA without rendered screenshots or browser evidence. Finish with a concise risk assessment, a merge recommendation, and up to three realistic failure modes or test gaps when useful. If a category has no substantiated issue, do not manufacture one.
