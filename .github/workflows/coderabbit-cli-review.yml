name: CodeRabbit CLI Review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: coderabbit-cli-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: CodeRabbit CLI PR review
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Check credentials before checking out any pull-request content.
      - name: Check for CodeRabbit Agentic API key
        id: credentials
        shell: bash
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${CODERABBIT_API_KEY:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## CodeRabbit CLI review"
              echo
              echo "Skipped: repository Actions secret `CODERABBIT_API_KEY` is not configured or is unavailable to this PR (for example, a fork PR)."
              echo
              echo "Create an Agentic API key in CodeRabbit and store it as the repository Actions secret described in `docs/coderabbit-cli.md`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::CodeRabbit CLI review skipped: CODERABBIT_API_KEY is missing or unavailable. See docs/coderabbit-cli.md."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "CodeRabbit credential is configured; its value will not be printed."

      - name: Checkout pull request head
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pinned CodeRabbit CLI
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          CODERABBIT_VERSION: 0.9.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.coderabbit.ai/install.sh -o "$RUNNER_TEMP/install-coderabbit.sh"
          bash "$RUNNER_TEMP/install-coderabbit.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          cr --version

      # Use the base commit's instructions so a PR cannot rewrite its own review rules.
      - name: Prepare trusted review instructions and base ref
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git show "${BASE_SHA}:.coderabbit-cli-instructions.md" > "$RUNNER_TEMP/coderabbit-cli-instructions.md"
          git branch --force "$BASE_REF" "$BASE_SHA"

      - name: Run CodeRabbit CLI review
        id: review
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        continue-on-error: true
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPORT_FILE: ${{ runner.temp }}/coderabbit-cli-review.ndjson
          STDERR_FILE: ${{ runner.temp }}/coderabbit-cli-review.stderr
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cr review --agent \
            --base "$BASE_REF" \
            --config "$RUNNER_TEMP/coderabbit-cli-instructions.md" \
            --api-key "$CODERABBIT_API_KEY" \
            > "$REPORT_FILE" 2> "$STDERR_FILE"
          review_exit_code=$?
          set -e
          echo "exit_code=$review_exit_code" >> "$GITHUB_OUTPUT"
          if [[ "$review_exit_code" -ne 0 ]]; then
            echo "::warning::CodeRabbit CLI did not complete successfully (exit code $review_exit_code). The PR comment will clearly mark the review as incomplete."
          fi
          exit "$review_exit_code"

      - name: Publish or update the pull-request review comment
        if: ${{ always() && steps.credentials.outputs.configured == 'true' && steps.review.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit_code }}
          REPORT_FILE: ${{ runner.temp }}/coderabbit-cli-review.ndjson
          COMMENT_JSON: ${{ runner.temp }}/coderabbit-cli-review-comment.json
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT_FILE"])
          events = []
          parse_errors = 0
          if report_path.exists():
              for raw_line in report_path.read_text(encoding="utf-8", errors="replace").splitlines():
                  line = raw_line.strip()
                  if not line:
                      continue
                  try:
                      item = json.loads(line)
                  except json.JSONDecodeError:
                      parse_errors += 1
                      continue
                  if isinstance(item, dict):
                      events.append(item)

          complete_events = [item for item in events if item.get("type") == "complete"]
          complete = complete_events[-1] if complete_events else None
          complete_status = complete.get("status") if complete else None
          outcome = complete.get("outcome") if complete else None
          try:
              unreviewed = int((complete or {}).get("unreviewedFileCount", 0) or 0)
          except (TypeError, ValueError):
              unreviewed = 1

          exit_code = os.environ.get("REVIEW_EXIT_CODE", "")
          review_complete = (
              exit_code == "0"
              and complete is not None
              and complete_status in ("review_completed", "review_skipped")
              and outcome not in ("failed", "incomplete")
              and unreviewed == 0
              and parse_errors == 0
          )
          findings = [item for item in events if item.get("type") == "finding"]
          severity_order = {"critical": 0, "major": 1, "minor": 2, "trivial": 3, "info": 4, "none": 5}
          findings.sort(key=lambda item: severity_order.get(str(item.get("severity", "info")).lower(), 6))

          def safe(value):
              # Do not let review text trigger user/team mentions in the PR conversation.
              return str(value or "").replace("@", "@\u200b")

          def markdown_path(value):
              return safe(value).replace("`", "\\`")

          lines = [
              "<!-- coderabbit-cli-review -->",
              "## CodeRabbit CLI review",
              "",
              f"**Status:** {'Completed' if review_complete else 'Incomplete / failed'}",
              f"**Commit reviewed:** `{safe(os.environ.get('HEAD_SHA', '')[:12])}`",
              f"**Review run:** [Open GitHub Actions run]({safe(os.environ.get('RUN_URL', ''))})",
              "",
          ]

          if not review_complete:
              lines.append(
                  f"**This is not a clean review.** The CLI exit code was `{safe(exit_code or 'unknown')}`; "
                  "the output did not confirm a complete successful review. Any findings shown below may be partial."
              )
              if parse_errors:
                  lines.append(f"The CLI output included {parse_errors} line(s) that were not valid JSON.")
              if unreviewed:
                  lines.append(f"The completion event reported {unreviewed} unreviewed file(s).")
              lines.append("")
          elif complete_status == "review_skipped":
              lines.extend(["No changes were available for review in the selected comparison.", ""])

          if findings:
              lines.append(f"### Findings ({len(findings)})")
              lines.append("")
              for index, finding in enumerate(findings[:20], start=1):
                  severity = safe(str(finding.get("severity", "info")).upper())
                  title = safe(finding.get("title") or "Finding")
                  file_name = markdown_path(finding.get("fileName") or "Repository-wide")
                  start_line = finding.get("startLine")
                  end_line = finding.get("endLine")
                  location = file_name
                  if start_line is not None:
                      location += f":L{start_line}"
                      if end_line is not None and end_line != start_line:
                          location += f"-L{end_line}"
                  detail = finding.get("comment") or finding.get("codegenInstructions") or "No detailed explanation was returned."
                  detail = safe(detail).strip()
                  if len(detail) > 1800:
                      detail = detail[:1800].rstrip() + "…"
                  lines.extend([
                      f"#### {index}. [{severity}] {title}",
                      f"**Location:** `{location}`",
                      "",
                      detail,
                      "",
                  ])
              if len(findings) > 20:
                  lines.append(f"_Showing 20 of {len(findings)} findings; see the workflow output for the full result._")
                  lines.append("")
          elif review_complete and complete_status != "review_skipped":
              lines.extend([
                  "No actionable findings were returned. This is not a guarantee that the pull request is defect-free.",
                  "",
              ])

          lines.extend([
              "---",
              "_This CLI review is an additional opinion. It does not edit or merge code and does not replace tests, security scanners, or human review._",
          ])
          body = "\n".join(lines)
          if len(body) > 55000:
              body = body[:54500].rstrip() + "\n\n_Comment truncated; see the workflow run for full output._"

          comment_path = Path(os.environ["COMMENT_JSON"])
          comment_path.write_text(json.dumps({"body": body}, ensure_ascii=False), encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(body + "\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"review_complete={'true' if review_complete else 'false'}\n")
              output.write(f"finding_count={len(findings)}\n")
          PY

          existing_comment_id="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '[.[][] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains("<!-- coderabbit-cli-review -->")))] | last | .id // empty')"

          if [[ -n "$existing_comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment_id" --input "$COMMENT_JSON" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$COMMENT_JSON" >/dev/null
          fi
          echo "Posted or updated the CodeRabbit CLI review comment."
