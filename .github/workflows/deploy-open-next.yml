name: Deploy OpenNext to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    name: Deploy OpenNext Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build Next.js app
        run: NODE_ENV=production npm run build

      - name: Build OpenNext for Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Verify .open-next/worker.js exists
        run: |
          if [ -f .open-next/worker.js ]; then
            echo "WORKER EXISTS";
          else
            echo "WORKER MISSING";
            ls -la .open-next || true;
            exit 1;
          fi

      - name: Verify .open-next/assets directory exists
        run: |
          if [ -d .open-next/assets ]; then
            echo "ASSETS DIR EXISTS";
          else
            echo "ASSETS DIR MISSING";
            ls -la .open-next || true;
            exit 1;
          fi

      - name: Publish to Cloudflare (wrangler)
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config ./wrangler.jsonc
