name: Deploy OpenNext to Cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: "cloudflare-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy OpenNext Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.3

      - name: Install dependencies (pnpm install)
        run: pnpm install --frozen-lockfile

      - name: Clear cache directories
        run: rm -rf .next/cache .open-next

      - name: Build Next.js app
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: NODE_ENV=production pnpm run build

      - name: Build OpenNext for Cloudflare
        run: pnpm exec opennextjs-cloudflare build

      - name: Verify .open-next/worker.js exists
        run: |
          if [ -f .open-next/worker.js ]; then
            echo "WORKER EXISTS";
          else
            echo "WORKER MISSING";
            ls -la .open-next || true;
            exit 1;
          fi

      - name: Verify .open-next/assets directory exists
        run: |
          if [ -d .open-next/assets ]; then
            echo "ASSETS DIR EXISTS";
          else
            echo "ASSETS DIR MISSING";
            ls -la .open-next || true;
            exit 1;
          fi

      # OpenNext's remote R2 cache population can hang during deploy in CI.
      # Bypass that step and let the deployed Worker repopulate cache entries lazily.
      - name: Publish to Cloudflare via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPEN_NEXT_DEPLOY: 'true'
        run: |
          set -o pipefail
          for delay in 60 120 180 300; do
            set +e
            output=$(pnpm exec wrangler deploy --config ./wrangler.jsonc 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! printf '%s\n' "$output" | grep -Eq '429 Too Many Requests|More than 1200 requests per 300 seconds|code: 10500'; then
              exit "$status"
            fi

            echo "Cloudflare API rate limit detected; retrying after ${delay}s."
            sleep "$delay"
          done

          echo "Cloudflare API remained rate-limited after bounded retries."
          exit 1
