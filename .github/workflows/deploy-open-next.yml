name: Deploy OpenNext to Cloudflare

on:
  push:
    branches: [main]

# 🔴 PROTECTED DEPLOYMENT SAFEGUARD — AUTHORIZATION REQUIRED
#
# Do not remove or change this concurrency protection unless the task
# explicitly authorizes a Cloudflare deployment-control change.
# cancel-in-progress MUST remain false so a newer run waits rather than
# cancelling an active Cloudflare deployment.
concurrency:
  group: "cloudflare-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy OpenNext Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3

      - name: Install dependencies (pnpm install)
        run: pnpm install --frozen-lockfile

      - name: Clear cache directories
        run: rm -rf .next/cache .open-next

      - name: Build Next.js app
        env:
          GITHUB_SHA: ${{ github.sha }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: NODE_ENV=production pnpm run build

      - name: Build OpenNext for Cloudflare
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm exec opennextjs-cloudflare build

      - name: Verify compiled Tailwind CSS
        run: |
          css_dir=".open-next/assets/_next/static/css"
          if [ ! -d "$css_dir" ]; then
            echo "COMPILED CSS DIR MISSING";
            find .open-next/assets -maxdepth 4 -type d | sort | head -100 || true;
            exit 1;
          fi

          css_file="$(find "$css_dir" -type f -name '*.css' -print -quit)"
          if [ -z "$css_file" ]; then
            echo "NO GENERATED CSS FILE FOUND";
            find "$css_dir" -maxdepth 2 -type f -print | sort | head -100 || true;
            exit 1;
          fi

          if grep -R -n -F '@tailwind base;' "$css_dir"; then
            echo "UNPROCESSED TAILWIND DIRECTIVE DETECTED";
            exit 1;
          else
            grep_status=$?
            if [ "$grep_status" -gt 1 ]; then
              echo "TAILWIND CSS SCAN FAILED (grep exit $grep_status)";
              exit "$grep_status";
            fi
          fi

          echo "TAILWIND CSS COMPILED"

      - name: Verify .open-next/worker.js exists
        run: |
          if [ -f .open-next/worker.js ]; then
            echo "WORKER EXISTS";
          else
            echo "WORKER MISSING";
            ls -la .open-next || true;
            exit 1;
          fi

      - name: Verify .open-next/assets directory exists
        run: |
          if [ -d .open-next/assets ]; then
            echo "ASSETS DIR EXISTS";
          else
            echo "ASSETS DIR MISSING";
            ls -la .open-next || true;
            exit 1;
          fi

      # 🔴 PROTECTED RATE-LIMIT SAFEGUARD — AUTHORIZATION REQUIRED
      #
      # Do not remove, disable, broaden, or materially alter this bounded
      # Cloudflare API retry/backoff unless the task explicitly authorizes a
      # deployment rate-limit change. Non-rate-limit failures must still fail
      # immediately; recognized Cloudflare 429/10500/10013 responses use bounded
      # backoff only.
      # OpenNext's remote R2 cache population can hang during deploy in CI.
      # Bypass that step and let the deployed Worker repopulate cache entries lazily.
      - name: Publish to Cloudflare via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPEN_NEXT_DEPLOY: 'true'
        run: |
          set -o pipefail
          for delay in 60 120 180 300; do
            set +e
            output=$(pnpm exec wrangler deploy --config ./wrangler.jsonc 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! printf '%s\n' "$output" | grep -Eq '429 Too Many Requests|More than 1200 requests per 300 seconds|code: 10500|code: 10013'; then
              exit "$status"
            fi

            echo "Cloudflare API rate limit detected; retrying after ${delay}s."
            sleep "$delay"
          done

          echo "Cloudflare API remained rate-limited after bounded retries."
          exit 1

  # 🔴 CLOUDFLARE OBSERVABILITY ISSUE RESOLUTION — AUTHORIZATION REQUIRED
  #
  # Runs only after the deploy job succeeded for a push to main. It resolves the
  # Cloudflare Workers Observability issue(s) that the deployed fix names with an
  # explicit `Cloudflare-Issue: <uuid>` trailer in its commit message or pull
  # request body, using the `CLOUDFLARE_API_TOKEN` Worker secret held by the
  # deployed Worker. It fails the run when Cloudflare does not confirm the
  # resolved status, leaving the issue unresolved. It never runs on pull
  # requests, never resolves an unreferenced issue, and does not touch the
  # Workers Observability scanner, webhook, GitHub issue creation, duplicate
  # protection or notification policy.
  resolve-observability-issues:
    name: Resolve Cloudflare observability issues
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Collect Cloudflare issue references from the deployed fix
        id: references
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${BEFORE_SHA:-}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
            commit_log="$(git log -1 --format=%B "${HEAD_SHA}")"
          else
            commit_log="$(git log --format=%B "${BEFORE_SHA}..${HEAD_SHA}")"
          fi

          commits_json="$(printf '%s' "$commit_log" | jq -R -s 'split("\n\n") | map(select(length > 0))')"
          first_pass="$(jq -cn --argjson commits "$commits_json" '{commitMessages: $commits}' \
            | node .github/scripts/cloudflare-issue-references.mjs)"

          bodies='[]'
          while IFS= read -r pr_number; do
            [[ -z "$pr_number" ]] && continue
            pr_body="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}" --jq '.body // ""')"
            bodies="$(jq --arg body "$pr_body" '. + [$body]' <<<"$bodies")"
          done < <(printf '%s' "$first_pass" | jq -r '.pullRequestNumbers[]?')

          references="$(jq -cn --argjson commits "$commits_json" --argjson bodies "$bodies" \
            '{commitMessages: $commits, pullRequestBodies: $bodies}' \
            | node .github/scripts/cloudflare-issue-references.mjs)"

          issue_ids="$(printf '%s' "$references" | jq -r '.issueIds | join(",")')"
          if [[ -z "$issue_ids" ]]; then
            echo "::notice::No 'Cloudflare-Issue: <id>' reference found in the deployed commits or their pull requests. Nothing was resolved."
            exit 0
          fi

          echo "issue_ids=${issue_ids}" >> "$GITHUB_OUTPUT"
          printf 'Cloudflare issue reference(s) from the deployed fix: `%s`\n' "$issue_ids" >> "$GITHUB_STEP_SUMMARY"

      - name: Ask the deployed Worker to resolve the referenced issues
        if: steps.references.outputs.issue_ids != ''
        shell: bash
        env:
          RESOLVE_TOKEN: ${{ secrets.CLOUDFLARE_ISSUE_RESOLVE_TOKEN }}
          ISSUE_IDS: ${{ steps.references.outputs.issue_ids }}
        run: |
          set -euo pipefail

          if [[ -z "${RESOLVE_TOKEN:-}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_ISSUE_RESOLVE_TOKEN is not configured. The Cloudflare issue was left unresolved."
            exit 1
          fi

          payload="$(jq -cn --arg ids "$ISSUE_IDS" '{issueIds: ($ids | split(","))}')"
          endpoint="https://luckypickcanada.ca/api/cloudflare-issues/resolve"
          attempt=1
          max_attempts=5

          while :; do
            response_file="$(mktemp)"
            status="$(curl -sS -o "$response_file" -w '%{http_code}' \
              --max-time 30 \
              -X POST "$endpoint" \
              -H "Authorization: Bearer ${RESOLVE_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$payload" 2>/dev/null || printf '000')"
            response_body="$(cat "$response_file")"
            rm -f "$response_file"

            if [[ "$status" == "200" ]] && [[ "$(printf '%s' "$response_body" | jq -r '.resolved // false' 2>/dev/null || printf 'false')" == "true" ]]; then
              printf '%s\n' "$response_body" | jq -c '.results' || true
              echo "::notice::Cloudflare confirmed the resolved status for: ${ISSUE_IDS}"
              exit 0
            fi

            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "::error::Cloudflare did not confirm the resolved status (HTTP ${status}). The issue(s) ${ISSUE_IDS} remain unresolved."
              printf '%s\n' "$response_body" | jq -c '.results? // .' || printf '%s\n' "$response_body"
              exit 1
            fi

            echo "Resolution not confirmed yet (HTTP ${status}); retrying in 15s (attempt ${attempt}/${max_attempts})."
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Record the unresolved issue in the run summary
        if: failure()
        shell: bash
        env:
          ISSUE_IDS: ${{ steps.references.outputs.issue_ids }}
        run: |
          {
            echo "## 🔴 Cloudflare observability issue resolution failed"
            echo
            echo "Cloudflare did not confirm a \`resolved\` status for: \`${ISSUE_IDS:-unknown}\`."
            echo
            echo "The issue(s) were left unresolved. Resolve them manually in the Cloudflare dashboard after verifying the deployed fix."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Cloudflare issue resolution was not confirmed; ${ISSUE_IDS:-the referenced issue} remains unresolved."
