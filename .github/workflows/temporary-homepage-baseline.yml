name: Temporary Homepage Visual Baseline Update

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-homepage-baseline.yml'
      - 'app/globals.css'
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  update-baselines:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate approved homepage baselines
        run: pnpm exec playwright test --update-snapshots

      - name: Commit regenerated baselines
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/visual/__screenshots__; then
            echo "No screenshot changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          git commit -m "test(homepage): update visual baselines for restored sky"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
