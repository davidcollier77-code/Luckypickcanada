name: OpenNext Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - open-next-repair
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-opennext:
    name: Validate OpenNext build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show package scripts
        run: npm run

      - name: Run production build
        run: npm run build
