name: PR Scope Verification

# Read-only pull_request_target check: compare the PR description with GitHub's
# actual changed-file list. Do not check out or execute PR code.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-scope-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  verify-scope:
    name: PR Scope Verification
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/approve-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base-branch checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Fetch pull request, changed files, and owner comments
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/pr.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            | jq 'add // []' > "${RUNNER_TEMP}/files.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq 'add // []' > "${RUNNER_TEMP}/comments.json"

      - name: Compare declared scope with the actual pull request diff
        env:
          OWNER: ${{ github.repository_owner }}
          PR_FILE: ${{ runner.temp }}/pr.json
          FILES_FILE: ${{ runner.temp }}/files.json
          COMMENTS_FILE: ${{ runner.temp }}/comments.json
          SUMMARY_FILE: ${{ runner.temp }}/qa-scope-summary.md
          REPORT_FILE: ${{ runner.temp }}/qa-scope-report.json
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 .github/scripts/check_qa_pr_scope.py \
            --pull-request "$PR_FILE" \
            --files "$FILES_FILE" \
            --comments "$COMMENTS_FILE" \
            --owner "$OWNER" \
            --summary "$SUMMARY_FILE" \
            --json "$REPORT_FILE"
          status=$?
          set -e
          if [[ -f "$SUMMARY_FILE" ]]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "::error::The PR scope declaration does not match the actual diff or an explicit owner approval is missing."
            exit "$status"
          fi

      - name: Review changed code for security and quality risks
        if: always()
        env:
          FILES_FILE: ${{ runner.temp }}/files.json
          SUMMARY_FILE: ${{ runner.temp }}/qa-review-summary.md
          REPORT_FILE: ${{ runner.temp }}/qa-review-report.json
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 .github/scripts/review_pr_changes.py \
            --files "$FILES_FILE" \
            --summary "$SUMMARY_FILE" \
            --json "$REPORT_FILE"
          status=$?
          set -e
          if [[ -f "$SUMMARY_FILE" ]]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$status" -eq 2 ]]; then
            echo "::error::The changed-code review could not run because GitHub's file evidence was missing or malformed."
            exit "$status"
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "::error::The changed-code review found a hard security or merge-integrity failure."
            exit "$status"
          fi
