name: PR Scope Verification

# Read-only pull_request_target check: compare the PR description with GitHub's
# actual changed-file list. Do not check out or execute PR code.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  # Findings are published once, as a single updated comment on the pull
  # request, so the developer reads the problem and the suggested fix together.
  pull-requests: write
  issues: read

concurrency:
  group: pr-scope-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  verify-scope:
    name: PR Scope Verification
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/approve-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base-branch checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Fetch pull request, changed files, and owner comments
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/pr.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            | jq 'add // []' > "${RUNNER_TEMP}/files.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq 'add // []' > "${RUNNER_TEMP}/comments.json"

      - name: Compare declared scope with the actual pull request diff
        env:
          OWNER: ${{ github.repository_owner }}
          PR_FILE: ${{ runner.temp }}/pr.json
          FILES_FILE: ${{ runner.temp }}/files.json
          COMMENTS_FILE: ${{ runner.temp }}/comments.json
          SUMMARY_FILE: ${{ runner.temp }}/qa-scope-summary.md
          REPORT_FILE: ${{ runner.temp }}/qa-scope-report.json
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 .github/scripts/check_qa_pr_scope.py \
            --pull-request "$PR_FILE" \
            --files "$FILES_FILE" \
            --comments "$COMMENTS_FILE" \
            --owner "$OWNER" \
            --summary "$SUMMARY_FILE" \
            --json "$REPORT_FILE"
          status=$?
          set -e
          if [[ -f "$SUMMARY_FILE" ]]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "::error::The PR scope declaration does not match the actual diff or an explicit owner approval is missing."
            exit "$status"
          fi

      - name: Review changed code for security and quality risks
        if: always()
        env:
          FILES_FILE: ${{ runner.temp }}/files.json
          SUMMARY_FILE: ${{ runner.temp }}/qa-review-summary.md
          REPORT_FILE: ${{ runner.temp }}/qa-review-report.json
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 .github/scripts/review_pr_changes.py \
            --files "$FILES_FILE" \
            --summary "$SUMMARY_FILE" \
            --json "$REPORT_FILE"
          status=$?
          set -e
          if [[ -f "$SUMMARY_FILE" ]]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$status" -eq 2 ]]; then
            echo "::error::The changed-code review could not run because GitHub's file evidence was missing or malformed."
            exit "$status"
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "::error::The changed-code review found a hard security or merge-integrity failure."
            exit "$status"
          fi

      # The job summary is only visible to someone who opens the run. This
      # republishes the same report where the developer already is, with the
      # suggested fix beside every finding, and rewrites that one comment on
      # later runs instead of stacking a new comment each time. The review step
      # above has already decided pass/fail, so a transient comment failure must
      # not change the gate result.
      - name: Publish the changed-code review as a pull request comment
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPORT_FILE: ${{ runner.temp }}/qa-review-summary.md
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- qa-review-report -->'
          if [[ ! -f "$REPORT_FILE" ]]; then
            echo "::warning::No changed-code review report was produced, so no comment is published."
            exit 0
          fi
          body="$(mktemp)"
          trimmed="$(mktemp)"
          trap 'rm -f "$body" "$trimmed"' EXIT
          {
            printf '%s\n\n' "$marker"
            cat "$REPORT_FILE"
          } > "$body"
          # GitHub rejects a comment body over 65536 characters.
          if [[ "$(wc -c < "$body")" -gt 60000 ]]; then
            head -c 58000 "$body" > "$trimmed"
            {
              cat "$trimmed"
              printf '\n\n_Report truncated; the workflow job summary holds the full list._\n'
            } > "$body"
          fi
          existing="$(
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              | jq -r --arg marker "$marker" \
                'add | .[] | select((.body // "") | startswith($marker)) | .id' \
              | head -n 1
          )"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${existing}" \
              -F body=@"$body" > /dev/null
            echo "Updated changed-code review comment ${existing}."
          else
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@"$body" > /dev/null
            echo "Published the changed-code review as a new comment."
          fi
