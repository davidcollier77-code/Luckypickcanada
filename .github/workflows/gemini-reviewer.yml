name: Gemini PR Reviewer

on:
  # Use trusted base-branch workflow and scripts while treating PR content as untrusted data.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  workflow_dispatch:
    inputs:
      mode:
        description: "Review a PR or ask Gemini for optional code suggestions"
        type: choice
        options: [review, fix]
        default: review
        required: true
      pr_number:
        description: "Pull request number"
        type: number
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: gemini-reviewer-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  gemini-review:
    name: Review or suggest fixes for pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted base-branch code only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Node runtime
        run: node --version

      - name: Run Gemini reviewer
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PRIMARY_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODEL: gemini-3.6-flash
          GEMINI_SECOND_FALLBACK_MODEL: gemini-3.5-flash-lite
          GEMINI_MODE: ${{ inputs.mode || 'review' }}
          GEMINI_PR_NUMBER: ${{ inputs.pr_number || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: node .github/scripts/gemini-reviewer.cjs

      - name: Verify trusted reviewer files remain unchanged
        if: always()
        run: |
          git diff --exit-code -- GEMINI_REVIEWER.md .github/workflows .github/scripts

      # A run that dies before the reviewer can comment (for example a module-load error)
      # must still say something on the pull request. This step makes such a failure visible
      # instead of leaving a silent failed run behind. It is conditioned on the reviewer step
      # itself: the trusted-file integrity check above runs with `if: always()` and fails
      # legitimately whenever a PR touches reviewer files, which must never be reported as an
      # unfinished review.
      - name: Report reviewer failure on the pull request
        if: failure() && steps.review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_PATH: ${{ github.event_path }}
          PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          number=$(node -e 'const fs=require("fs");let e={};try{e=JSON.parse(fs.readFileSync(process.env.EVENT_PATH||"","utf8"));}catch{}const n=(e.pull_request&&e.pull_request.number)||(e.issue&&e.issue.number)||process.env.PR_NUMBER||"";process.stdout.write(String(n||""));')
          if [ -z "$number" ]; then
            echo "No pull request number is available for this event; nothing to report."
            exit 0
          fi
          body=$(printf '%s\n\n%s\n\n%s' \
            '## Gemini PR Reviewer did not finish' \
            'The reviewer stopped before it could publish a result, so this run says nothing about the code. It is not a finding, no code was changed, and the pull request was not merged. Post @gemini full review to try again.' \
            "Run: $RUN_URL")
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$body"

